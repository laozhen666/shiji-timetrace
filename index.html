    });
  };
  SJ.actions['copy'] = function (el) { SJ.copy(el.dataset.text); };

  SJ.actions['me.privacy'] = function () {
    SJ.modal({
      title: '数据与隐私', body: '<div class="prose"><p><b>你的数据只在这台设备的浏览器里。</b>时迹的演示版没有服务器，所有记录、照片、证书都存在 localStorage 中，不会上传。</p><p>正式部署时，我们建议采用「本地优先 + 组织见证 + 脱敏上链」：原始服务内容留在组织侧，链上只保存哈希与最小必要字段，公开验真页默认对姓名做脱敏。</p><p>你可以随时在「我的 → 导出我的数据」带走全部数据，或重置演示。</p></div>'
    });
  };
  SJ.actions['me.export'] = function () {
    SJ.download('时迹-我的数据-' + SJ.fmt.ymd(new Date()) + '.json', JSON.stringify(SJ.db, null, 2), 'application/json');
    SJ.toast('数据已导出');
  };
  SJ.actions['me.reset'] = function () {
    SJ.confirm('重置演示数据？', '当前浏览器里的所有记录、照片和兑换记录都会被清空，并恢复到初始演示状态。', '重置').then(function (ok) { if (ok) SJ.resetDemo(); });
  };
  SJ.actions['me.about'] = function () {
    SJ.modal({
      title: '关于时迹', body: '<div class="about"><div class="about-logo">' + SJ.logo(46) + '</div><h3>时迹 TimeTrace</h3><p class="slogan">让每一小时，都有迹可循。</p><p>一套面向志愿服务组织的可信时长基础设施：记录、见证、存证、激励。单文件、零依赖、可离线，数据默认留在本地。</p><div class="about-meta"><span>中原黑客松 · 2026</span><span>郑州</span><span>v1.0</span></div></div>'
    });
  };
  SJ.actions['report.download'] = function () {
    var cv = document.getElementById('report-canvas');
    if (!cv) return;
    var a = document.createElement('a');
    a.download = '时迹-2026年度报告-' + SJ.currentUser().name + '.png';
    a.href = cv.toDataURL('image/png');
    a.click();
    SJ.toast('海报已保存');
  };
  SJ.actions['report.share'] = function () {
    var s = reportStats();
    SJ.copy('我在时迹记录了 ' + s.year + ' 年的 ' + SJ.fmt.hours(s.hours * 60) + ' 小时志愿服务，是「' + s.word + '」。让每一小时，都有迹可循。');
  };
})(window.SJ);

</script>
<script>
/* ==== src/js/views/org.js ==== */
/* 时迹 TimeTrace · 组织审核台 */
(function (SJ) {
  'use strict';
  SJ.actions = SJ.actions || {};

  var UI = SJ.ui;

  function staff() { return SJ.orgStaff() || SJ.userById('s1'); }
  function orgId() { return staff().orgId || 1; }
  function org() { return SJ.orgById(orgId()); }
  function orgRecords() { return SJ.db.records.filter(function (r) { return r.orgId === orgId(); }); }
  function hoursOf(list) { return list.reduce(function (s, r) { return s + r.minutes; }, 0) / 60; }
  function userOf(r) { return SJ.userById(r.userId) || { name: r.userName, tone: r.userTone, school: '—' }; }

  function shell(active, title, sub, body, actions) {
    var o = org();
    var me = staff();
    var pending = orgRecords().filter(function (r) { return r.status === 'pending'; }).length;
    var nav = [
      ['overview', '概览', 'chart', '#/org'],
      ['review', '审核台', 'shield', '#/org/review'],
      ['projects', '项目', 'compass', '#/org/projects'],
      ['members', '成员', 'users', '#/org/members']
    ];
    return '<div class="org-shell">' +
      '<aside class="org-side">' +
      '<a class="brand" href="#/">' + SJ.logo(34) + '<div><b>时迹</b><span>组织工作台</span></div></a>' +
      '<div class="org-pick"><span class="op-label">当前组织</span><div class="op-name">' + SJ.esc(o.short) + '<span class="op-verified">' + SJ.icon('verify', 13) + '已认证</span></div><span class="op-sub">' + SJ.esc(o.name) + '</span></div>' +
      '<nav class="org-nav">' + nav.map(function (n) {
        return '<a href="' + n[3] + '" class="' + (active === n[0] ? 'on' : '') + '">' + SJ.icon(n[2], 18) + '<span>' + n[1] + '</span>' + (n[0] === 'review' && pending ? '<i class="nav-badge">' + pending + '</i>' : '') + '</a>';
      }).join('') + '</nav>' +
      '<div class="org-side-foot"><a href="#/app" class="side-link">' + SJ.icon('user', 16) + '志愿者端</a>' +
      '<div class="org-user" data-act="org.logout" role="button" tabindex="0" title="退出组织账号">' + SJ.avatar(me, 36) + '<div><b>' + SJ.esc(me.name) + '</b><span>' + SJ.esc(me.title || '组织管理员') + '</span></div>' + SJ.icon('logout', 16) + '</div></div>' +
      '</aside>' +
      '<main class="org-main">' +
      '<header class="org-top"><div><p class="eyebrow">' + SJ.esc(sub) + '</p><h1>' + SJ.esc(title) + '</h1></div><div class="org-top-r">' + (actions || '') +
      '<span class="date-chip">' + SJ.fmt.dateFull(new Date()) + '</span>' +
      '<button class="icon-btn bell" data-act="notifications">' + SJ.icon('bell', 19) + '</button></div></header>' +
      '<div class="org-body">' + body + '</div>' +
      '</main></div>';
  }

  function kpi(label, value, unit, delta, icon, tone) {
    return '<div class="kpi ' + (tone || '') + '"><div class="kpi-top"><span>' + label + '</span><span class="kpi-ic">' + SJ.icon(icon, 17) + '</span></div><div class="kpi-val">' + value + '<i>' + (unit || '') + '</i></div><div class="kpi-foot">' + (delta || '') + '</div></div>';
  }

  function chart14() {
    var days = [], labels = [];
    for (var i = 13; i >= 0; i--) {
      var d = new Date(); d.setDate(d.getDate() - i);
      var key = SJ.fmt.ymd(d);
      days.push({ key: key, min: 0, label: (d.getMonth() + 1) + '/' + d.getDate() });
    }
    orgRecords().forEach(function (r) {
      if (r.status !== 'approved') return;
      var d = days.filter(function (x) { return x.key === r.serviceDate; })[0];
      if (d) d.min += r.minutes;
    });
    var W = 680, H = 200, pl = 34, pr = 12, pt = 16, pb = 28;
    var max = Math.max.apply(null, days.map(function (d) { return d.min / 60; }).concat([4]));
    max = Math.ceil(max / 2) * 2;
    var pts = days.map(function (d, i) {
      var x = pl + i * (W - pl - pr) / (days.length - 1);
      var y = H - pb - (d.min / 60) / max * (H - pt - pb);
      return [x, y];
    });
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
    var area = line + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + (H - pb) + ' L' + pts[0][0].toFixed(1) + ' ' + (H - pb) + ' Z';
    var grid = '';
    for (var g = 0; g <= 4; g++) {
      var y = pt + g * (H - pt - pb) / 4;
      grid += '<line x1="' + pl + '" y1="' + y + '" x2="' + (W - pr) + '" y2="' + y + '" stroke="#e8e0d0" stroke-width="1"/><text x="' + (pl - 8) + '" y="' + (y + 4) + '" text-anchor="end" class="ax">' + (max - g * max / 4) + 'h</text>';
    }
    var dots = pts.map(function (p, i) {
      if (i % 2) return '';
      return '<text x="' + p[0] + '" y="' + (H - 8) + '" text-anchor="middle" class="ax">' + days[i].label + '</text>';
    }).join('');
    return '<svg class="area-chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
      '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f05a28" stop-opacity=".28"/><stop offset="1" stop-color="#f05a28" stop-opacity="0"/></linearGradient></defs>' +
      grid + '<path d="' + area + '" fill="url(#ag)"/><path d="' + line + '" fill="none" stroke="#f05a28" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
      pts.map(function (p) { return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="2.6" fill="#f05a28"/>'; }).join('') + dots + '</svg>';
  }

  function reviewCard(r, compact) {
    var u = userOf(r);
    var risk = r.risk || SJ.risk(r, SJ.db.records);
    var st = SJ.statusMeta(r.status);
    var checked = SJ._orgSel && SJ._orgSel[r.id];
    return '<div class="review-card ' + (compact ? 'compact ' : '') + (checked ? 'sel ' : '') + '" data-act="org.open" data-id="' + r.id + '">' +
      (compact ? '' : '<label class="cb" onclick="event.stopPropagation()"><input type="checkbox" data-act="org.select" data-id="' + r.id + '" ' + (checked ? 'checked' : '') + '><i></i></label>') +
      '<div class="rc-avatar">' + SJ.avatar(u, 40) + '</div>' +
      '<div class="rc-main">' +
      '<div class="rc-top"><b>' + SJ.esc(u.name) + '</b><span class="rc-school">' + SJ.esc(u.school || '') + '</span>' + (compact ? '' : UI.status(r)) + '<span class="risk-chip ' + risk.level + '">' + risk.word + ' ' + risk.score + '</span></div>' +
      '<h3>' + SJ.esc(r.projectName) + '<span class="rc-hours">' + SJ.fmt.hours(r.minutes) + 'h</span></h3>' +
      '<p class="rc-content">' + SJ.esc(r.content) + '</p>' +
      '<div class="rc-meta">' + SJ.icon('calendar', 13) + r.serviceDate + ' ' + SJ.fmt.time(r.startAt) + '<span class="dot-sep"></span>' + SJ.icon('pin', 13) + SJ.esc(r.location) + '<span class="dot-sep"></span>' + SJ.icon('user', 13) + SJ.esc(r.witness && r.witness.name || '无见证人') + '</div>' +
      (r.photos && r.photos.length ? '<div class="rc-thumbs">' + r.photos.map(function (p, i) { return UI.photoTile(p, i, false); }).join('') + '</div>' : '') +
      '</div>' +
      '<div class="rc-side">' +
      '<div class="rc-amount">' + SJ.fmt.hours(r.minutes) + '<i>h</i></div>' +
      (r.status === 'pending' ?
        '<button class="btn sm ok" data-act="org.approve" data-id="' + r.id + '">' + SJ.icon('check', 14) + '通过</button><button class="btn sm ghost" data-act="org.reject" data-id="' + r.id + '">驳回</button>' :
        '<button class="btn sm ghost" data-act="org.open" data-id="' + r.id + '">查看</button>') +
      '</div></div>';
  }

  function viewOverview() {
    var recs = orgRecords();
    var approved = recs.filter(function (r) { return r.status === 'approved'; });
    var pending = recs.filter(function (r) { return r.status === 'pending'; });
    var rejected = recs.filter(function (r) { return r.status === 'rejected'; });
    var month = new Date().getMonth(), year = new Date().getFullYear();
    var monthMin = approved.filter(function (r) {
      var d = new Date(r.serviceDate); return d.getMonth() === month && d.getFullYear() === year;
    }).reduce(function (s, r) { return s + r.minutes; }, 0);
    var volunteers = {};
    approved.forEach(function (r) { volunteers[r.userId] = 1; });
    var rate = approved.length + rejected.length ? Math.round(approved.length / (approved.length + rejected.length) * 100) : 100;
    var chainAudit = SJ.chain.audit(SJ.db);
    var queue = pending.slice().sort(function (a, b) { return new Date(a.startAt) - new Date(b.startAt); });
    var projects = SJ.db.projects.filter(function (p) { return p.orgId === orgId(); });

    var body = '<div class="kpi-grid">' +
      kpi('本月认证时长', SJ.fmt.hours(monthMin), 'h', '<span class="up">↑ 18.6%</span> 较上月', 'clock', 'accent') +
      kpi('待见证记录', pending.length, '条', '<span class="warn">' + (queue.filter(function (r) { return r.risk && r.risk.level === 'high'; }).length) + ' 条高风险待复核</span>', 'shield') +
      kpi('认证通过率', rate, '%', '<span class="up">↑ 2.1%</span> 高于平台均值', 'verify') +
      kpi('活跃志愿者', Object.keys(volunteers).length, '人', '近 90 天有服务记录', 'users') +
      '</div>' +
      '<div class="org-grid">' +
      '<section class="panel chart-panel"><div class="panel-head"><div><h2>近 14 天服务时长</h2><p>按服务日期统计 · 单位：小时</p></div><span class="legend"><i></i>已认证</span></div>' + chart14() + '</section>' +
      '<section class="panel org-profile"><div class="panel-head"><h2>组织档案</h2><span class="tag-verified">' + SJ.icon('verify', 12) + '已认证</span></div>' +
      '<div class="op-big">' + SJ.esc(org().name) + '</div>' +
      '<div class="op-rows"><div><span>组织类型</span><b>' + org().type + '</b></div><div><span>入驻时间</span><b>' + org().joined + ' 年</b></div><div><span>累计认证</span><b>' + approved.length + ' 条</b></div><div><span>链上区块</span><b class="mono">#' + (approved.length ? Math.max.apply(null, approved.map(function (r) { return r.seq; })) : 0) + '</b></div><div><span>全链状态</span><b class="' + (chainAudit.ok ? 'ok-text' : 'bad-text') + '">' + (chainAudit.ok ? '完整 · ' + chainAudit.checked + ' 块' : '异常') + '</b></div></div>' +
      '<div class="op-actions"><a class="btn ghost sm" href="#/org/review">进入审核台</a><a class="btn dark sm" href="#/screen">' + SJ.icon('grid', 14) + '看大屏</a></div></section>' +
      '<section class="panel queue-panel"><div class="panel-head"><div><h2>待见证队列</h2><p>按服务时间排序，优先处理高风险</p></div><a class="link" href="#/org/review">全部 ' + pending.length + ' 条' + SJ.icon('chevronRight', 14) + '</a></div>' +
      (queue.length ? '<div class="queue-list">' + queue.slice(0, 5).map(function (r) { return reviewCard(r, true); }).join('') + '</div>' : UI.empty('check', '队列清空了', '所有记录都已见证')) + '</section>' +
      '<section class="panel projects-mini"><div class="panel-head"><div><h2>共同项目</h2><p>全平台 ' + SJ.db.projects.length + ' 个 · 本组织 ' + projects.length + ' 个</p></div><a class="link" href="#/org/projects">管理' + SJ.icon('chevronRight', 14) + '</a></div>' +
      '<div class="mini-projects">' + projects.slice(0, 4).map(function (p) {
        var pr = recs.filter(function (r) { return r.projectId === p.id && r.status === 'pending'; }).length;
        return '<a class="mini-proj" href="#/org/review"><span class="mp-dot" style="background:' + SJ.catMeta(p.category).color + '"></span><div><b>' + SJ.esc(p.name) + '</b><span>' + p.joined + '/' + p.quota + ' 人 · ' + SJ.esc(p.status) + '</span></div>' + (pr ? '<i class="mp-badge">' + pr + '</i>' : '') + SJ.icon('chevronRight', 14) + '</a>';
      }).join('') + '</div></section>' +
      '</div>';
    var hh = new Date().getHours();
    var gm = hh < 6 ? '夜深了' : hh < 11 ? '上午好' : hh < 14 ? '中午好' : hh < 18 ? '下午好' : '晚上好';
    return shell('overview', gm + '，' + SJ.esc(staff().name), 'ORG CONSOLE · ' + SJ.fmt.dateFull(new Date()), body,
      '<button class="btn ghost sm" data-act="org.export">' + SJ.icon('download', 15) + '导出数据</button><button class="btn dark sm" data-act="org.newproject">' + SJ.icon('plus', 15) + '发布项目</button>');
  }

  function viewReview() {
    var tab = SJ._orgTab || 'pending';
    var q = SJ._orgQuery || '';
    var recs = orgRecords().slice().sort(function (a, b) { return new Date(b.startAt) - new Date(a.startAt); });
    var counts = {
      pending: recs.filter(function (r) { return r.status === 'pending'; }).length,
      approved: recs.filter(function (r) { return r.status === 'approved'; }).length,
      rejected: recs.filter(function (r) { return r.status === 'rejected'; }).length,
      all: recs.length
    };
    var list = tab === 'all' ? recs : recs.filter(function (r) { return r.status === tab; });
    if (q) list = list.filter(function (r) { return (r.userName + r.projectName + r.content).indexOf(q) >= 0; });
    var tabs = [['pending', '待见证'], ['approved', '已认证'], ['rejected', '未通过'], ['all', '全部']];
    var body = '<div class="review-toolbar">' +
      '<div class="seg">' + tabs.map(function (t) { return '<button class="seg-btn ' + (tab === t[0] ? 'on' : '') + '" data-act="org.tab" data-tab="' + t[0] + '">' + t[1] + '<i>' + counts[t[0]] + '</i></button>'; }).join('') + '</div>' +
      '<div class="search-box sm">' + SJ.icon('search', 16) + '<input id="org-q" placeholder="搜索志愿者、项目或内容" value="' + SJ.esc(q) + '"></div>' +
      '<button class="btn ghost sm" data-act="org.export">' + SJ.icon('download', 15) + '导出</button>' +
      '</div>' +
      '<div class="review-hint">' + SJ.icon('shield', 15) + '<span>审核通过后，记录将写入 <b class="mono">SHA-256 哈希链</b>，生成可验真证书；驳回会记录原因并通知志愿者。</span></div>' +
      '<div class="review-list">' + (list.length ? list.map(function (r) { return reviewCard(r); }).join('') : UI.empty('check', '这里空空如也', tab === 'pending' ? '所有记录都已见证' : '换个筛选条件看看')) + '</div>' +
      '<div class="batch-bar" id="batch-bar"></div>';
    return shell('review', '审核台', 'REVIEW QUEUE', body, '');
  }

  function viewProjects() {
    var recs = orgRecords();
    var all = SJ.db.projects;
    var own = all.filter(function (p) { return p.orgId === orgId(); });
    var filter = SJ._orgProjFilter || 'all';
    var others = all.filter(function (p) { return p.orgId !== orgId(); });
    var projects = filter === 'mine' ? own : own.concat(others);
    var body = '<div class="org-section-head"><div><h2>项目' + '<span class="count-chip">' + projects.length + '</span></h2><p>与志愿者端共用同一份项目库 · 全部 ' + all.length + ' 个 · 本组织 ' + own.length + ' 个</p></div><button class="btn dark sm" data-act="org.newproject">' + SJ.icon('plus', 15) + '发布新项目</button></div>' +
      '<div class="seg org-seg"><button class="seg-btn ' + (filter === 'all' ? 'on' : '') + '" data-act="org.projfilter" data-f="all">全部项目 ' + all.length + '</button><button class="seg-btn ' + (filter === 'mine' ? 'on' : '') + '" data-act="org.projfilter" data-f="mine">本组织 ' + own.length + '</button></div>' +
      '<div class="org-proj-grid">' + projects.map(function (p) {
        var mine = p.orgId === orgId();
        var pr = mine ? recs.filter(function (r) { return r.projectId === p.id; }) : [];
        var pend = pr.filter(function (r) { return r.status === 'pending'; }).length;
        var hrs = hoursOf(pr.filter(function (r) { return r.status === 'approved'; }));
        var enr = (SJ.db.enrollments || []).filter(function (e) { return e.projectId === p.id; }).length;
        var toggle = p.status === '已结束' ? '重新招募' : p.status === '招募中' ? '暂停招募' : '开放招募';
        return '<div class="org-proj' + (mine ? '' : ' is-readonly') + '"><div class="op-cover">' + UI.cover(p) + '</div><div class="op-body"><div class="op-top"><span class="op-status">' + SJ.esc(p.status) + '</span><span class="op-cat" style="color:' + SJ.catMeta(p.category).color + '">' + SJ.esc(p.category) + '</span></div>' +
          '<h3>' + SJ.esc(p.name) + (mine ? ' <i class="op-own mine">本组织</i>' : ' <i class="op-own">' + SJ.esc(p.orgShort) + '</i>') + '</h3><p class="op-date">' + SJ.fmt.date(p.start) + (p.start !== p.end ? '–' + SJ.fmt.date(p.end) : '') + ' · ' + p.hours + 'h/次 · ' + p.joined + '/' + p.quota + ' 人' + (enr ? ' · 新报名 ' + enr : '') + '</p>' +
          (mine
            ? '<div class="op-stats"><div><b>' + pr.length + '</b><span>条记录</span></div><div><b>' + SJ.fmt.hours(hrs * 60) + 'h</b><span>已认证</span></div><div><b class="' + (pend ? 'warn-text' : '') + '">' + pend + '</b><span>待见证</span></div></div>' +
              '<div class="op-foot"><a class="btn ghost sm" href="#/org/review">查看记录</a><button class="btn ghost sm" data-act="org.project.toggle" data-id="' + p.id + '">' + toggle + '</button></div>'
            : '<div class="op-stats readonly-note">' + SJ.icon('lock', 13) + '<span>其他组织发布 · 只读查看</span></div><div class="op-foot"><span class="op-readonly">不可管理</span></div>') +
          '</div></div>';
      }).join('') + '</div>';
    return shell('projects', '项目管理', 'PROJECTS', body, '');
  }

  SJ.actions['org.projfilter'] = function (el) {
    SJ._orgProjFilter = el.dataset.f;
    SJ.refresh();
  };

  function memberships() {
    return (SJ.db.memberships || []).filter(function (m) { return m.orgId === orgId(); });
  }

  function viewMembers() {
    var recs = orgRecords();
    var list = memberships().map(function (m) {
      var u = SJ.userById(m.userId);
      if (!u) return null;
      var mine = recs.filter(function (r) { return r.userId === u.id; });
      var row = { u: u, approved: 0, min: 0, pending: 0, last: '', cats: {}, addedAt: m.at };
      mine.forEach(function (r) {
        if (r.status === 'approved') { row.approved++; row.min += r.minutes; row.cats[r.category] = 1; }
        if (r.status === 'pending') row.pending++;
        if (r.serviceDate > row.last) row.last = r.serviceDate;
      });
      return row;
    }).filter(Boolean).sort(function (a, b) { return b.min - a.min || b.approved - a.approved; });

  /* ---- 动作 ---- */
  function refresh() { SJ.refresh(); }

  function approve(rec, silent) {
    if (!rec || rec.status === 'approved') return;
    rec.status = 'approved';
    rec.reviewNote = '';
    rec.reviewedAt = new Date().toISOString();
    rec.risk = rec.risk || SJ.risk(rec, SJ.db.records);
    SJ.chain.append(SJ.db, rec);
    var u = userOf(rec);
    SJ.pushEvent('cert', '<b>' + SJ.esc(u.name) + '</b> 的「' + SJ.esc(rec.projectName) + '」通过认证', SJ.fmt.hours(rec.minutes) + 'h · ' + rec.orgShort, rec.certNo);
    if (!silent) SJ.toast('已认证 · ' + rec.certNo);
  }

  function doApprove(id) {
    var rec = SJ.db.records.filter(function (r) { return r.id === id; })[0];
    if (!rec) return;
    SJ.confirm('通过这条记录？', '「' + rec.userName + '」的 ' + SJ.fmt.hours(rec.minutes) + ' 小时服务记录将写入哈希链，并生成证书 ' + '（第 ' + (SJ.db.records.filter(function (r) { return r.hash; }).length + 1) + ' 块）。', '通过并上链').then(function (ok) {
      if (!ok) return;
      approve(rec);
      SJ.persist();
      SJ.bus.emit({ type: 'approve', rec: rec });
      refresh();
      SJ.showCertToast(rec);
    });
  }

  function doReject(id) {
    var rec = SJ.db.records.filter(function (r) { return r.id === id; })[0];
    if (!rec) return;
    var reasons = ['服务内容与项目不符', '缺少见证人或有效证明', '时长明显异常', '重复提交', '服务时间与签到不一致'];
    var m = SJ.modal({
      title: '驳回记录', eyebrow: 'REJECT', body: '<p class="confirm-text">驳回「' + SJ.esc(rec.userName) + '」的「' + SJ.esc(rec.projectName) + '」记录，原因会同步给志愿者。</p><div class="chips reason-chips">' + reasons.map(function (r) { return '<button class="chip" data-reason="' + r + '">' + r + '</button>'; }).join('') + '</div><label class="field"><span>审核意见</span><textarea id="reject-note" rows="3" placeholder="请说明需要补充或修改的内容"></textarea></label>',
      footer: '<button class="btn ghost" data-close>取消</button><button class="btn danger" id="reject-ok">确认驳回</button>'
    });
    m.el.querySelectorAll('[data-reason]').forEach(function (b) {
      b.onclick = function () {
        m.el.querySelectorAll('[data-reason]').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        m.el.querySelector('#reject-note').value = b.dataset.reason;
      };
    });
    m.el.querySelector('#reject-ok').onclick = function () {
      var note = m.el.querySelector('#reject-note').value.trim();
      if (!note) { SJ.toast('写一句驳回原因', 'err'); return; }
      rec.status = 'rejected';
      rec.reviewNote = note;
      rec.reviewedAt = new Date().toISOString();
      SJ.pushEvent('reject', '<b>' + SJ.esc(rec.userName) + '</b> 的「' + SJ.esc(rec.projectName) + '」未通过审核', note.slice(0, 18));
      SJ.persist();
      SJ.bus.emit({ type: 'reject', rec: rec });
      m.close(); refresh();
      SJ.toast('已驳回，原因已通知志愿者');
    };
  }

      '<div class="rd-block"><span class="rd-label">见证人</span>' + (r.witness && r.witness.name ? '<div class="witness"><span class="w-avatar">' + SJ.esc(r.witness.name.slice(0, 1)) + '</span><div><b>' + SJ.esc(r.witness.name) + '</b><span>' + SJ.esc(r.witness.phone) + ' · ' + SJ.esc(r.witness.role || '') + '</span></div></div>' : '<p class="muted bad-text">未填写见证人</p>') + '</div>' +

  function batchApprove() {
    var ids = Object.keys(SJ._orgSel || {});
    var list = SJ.db.records.filter(function (r) { return ids.indexOf(r.id) >= 0 && r.status === 'pending'; });
    if (!list.length) return;
    var totalMin = list.reduce(function (s, r) { return s + r.minutes; }, 0);
    SJ.confirm('批量通过 ' + list.length + ' 条记录？', '合计 ' + SJ.fmt.hours(totalMin) + ' 小时，将依次写入哈希链并生成证书。建议先确认高风险记录。', '全部通过').then(function (ok) {
      if (!ok) return;
      list.forEach(function (r) { approve(r, true); });
      SJ._orgSel = {};
      SJ.persist();
      SJ.bus.emit({ type: 'approve-batch' });
      refresh();
      SJ.toast('已认证 ' + list.length + ' 条 · 新增 ' + list.length + ' 个区块');
    });
  }

  SJ.bindOrgLogin = function () {
    var form = document.getElementById('org-login-form');
    if (!form) return;
    var emailEl = document.getElementById('org-email');
    var passEl = document.getElementById('org-pass');
    var errEl = document.getElementById('org-err');
    var eye = document.getElementById('org-eye');
    function fail(msg) { errEl.textContent = msg; errEl.classList.add('on'); }
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errEl.classList.remove('on');
      var email = (emailEl.value || '').trim().toLowerCase();
      var pass = passEl.value || '';
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('请输入有效的组织邮箱');
      if (pass.length < 6) return fail('密码至少 6 位');
      var remember = !!(document.getElementById('org-remember') || {}).checked;
      var u = SJ.orgLogin(email, pass, remember);
      if (!u) return fail('组织邮箱或密码不正确');
      SJ.toast('欢迎回来，' + u.name);
      location.hash = '#/org';
    });
    if (eye) eye.addEventListener('click', function () {
      var show = passEl.type === 'password';
      passEl.type = show ? 'text' : 'password';
      eye.innerHTML = SJ.icon(show ? 'eyeOff' : 'eye', 17);
    });
    setTimeout(function () { if (emailEl && !emailEl.value) emailEl.focus(); }, 60);
  };

<script>
/* ==== src/js/views/screen.js ==== */
/* 时迹 TimeTrace · 城市数据大屏 */
(function (SJ) {
  'use strict';

  var CAT_COLORS = ['#ff6b35', '#4ecdc4', '#ffd166', '#a78bfa', '#f78fb3', '#7bd389', '#5aa9e6', '#f4a261', '#e76f51'];

  function approved() { return SJ.db.records.filter(function (r) { return r.status === 'approved'; }); }

  function totalHours() {
    return approved().reduce(function (s, r) { return s + r.minutes; }, 0) / 60;
  }

  function volunteerCount() {
    return SJ.db.users.filter(function (u) { return u.role === 'volunteer'; }).length;
  }

  function avgReviewHours() {
    var list = SJ.db.records.filter(function (r) { return r.status === 'approved' && r.serviceDate && r.verifiedAt; });
    if (!list.length) return 0;
    var sum = list.reduce(function (s, r) { return s + Math.max(0, new Date(r.verifiedAt) - new Date(r.serviceDate)); }, 0);
    return sum / list.length / 3600e3;
  }

  function rejectRate() {
    var ok = approved().length;
    var bad = SJ.db.records.filter(function (r) { return r.status === 'rejected'; }).length;
    return ok + bad ? bad / (ok + bad) * 100 : 0;
  }

  function catStats() {
    var map = {};
    approved().forEach(function (r) { map[r.category] = (map[r.category] || 0) + r.minutes; });
    var list = Object.keys(map).map(function (k) { return { name: k, min: map[k] }; }).sort(function (a, b) { return b.min - a.min; });
    var total = list.reduce(function (s, x) { return s + x.min; }, 0) || 1;
    list.forEach(function (x) { x.pct = x.min / total * 100; });
    return list;
  }

  function trend14() {
    var arr = [];
    for (var i = 13; i >= 0; i--) {
      var d = new Date(); d.setDate(d.getDate() - i);
      var key = SJ.fmt.ymd(d);
      var min = approved().filter(function (r) { return r.serviceDate === key; }).reduce(function (s, r) { return s + r.minutes; }, 0);
      arr.push({ key: key, min: min, label: (d.getMonth() + 1) + '/' + d.getDate() });
    }
    return arr;
  }

  function topVolunteers() {
    var map = {};
    approved().forEach(function (r) {
      if (!map[r.userId]) map[r.userId] = 0;
      map[r.userId] += r.minutes;
    });
    return Object.keys(map).map(function (id) {
      return { u: SJ.userById(id), min: map[id] };
    }).filter(function (x) { return x.u; }).sort(function (a, b) { return b.min - a.min; }).slice(0, 7);
  }

  function latestCerts() {
    return approved().filter(function (r) { return r.certNo; }).sort(function (a, b) { return new Date(b.verifiedAt) - new Date(a.verifiedAt); }).slice(0, 5);
  }

  function heatDots() {
    var base = [
      { id: 'p1', x: 44, y: 48, d: '银龄' }, { id: 'p2', x: 54, y: 56, d: '护河' },
      { id: 'p3', x: 34, y: 40, d: '导览' }, { id: 'p4', x: 68, y: 38, d: '春运' },
      { id: 'p5', x: 40, y: 58, d: '书香' }, { id: 'p6', x: 24, y: 50, d: '星星' },
      { id: 'p7', x: 47, y: 64, d: '邻里' }, { id: 'p8', x: 58, y: 60, d: '课堂' },
      { id: 'p9', x: 50, y: 30, d: '地铁' }, { id: 'p10', x: 37, y: 68, d: '急救' },
      { id: 'p11', x: 20, y: 28, d: '迎新' }, { id: 'p12', x: 30, y: 46, d: '夜游' }
    ];
    var all = approved();
    return base.map(function (d) {
      var n = all.filter(function (r) { return r.projectId === d.id; }).length;
      return { x: d.x, y: d.y, d: d.d, n: n, r: n ? Math.min(9.5, 3 + Math.sqrt(n)) : 0 };
    }).filter(function (d) { return d.n > 0; });
  }

  function sparkline(arr) {
    var W = 420, H = 44, max = Math.max.apply(null, arr.map(function (a) { return a.min; }).concat([1]));
    var pts = arr.map(function (a, i) {
      return [i * W / (arr.length - 1), H - 4 - a.min / max * (H - 10)];
    });
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
    return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none"><path d="' + line + ' L' + W + ' ' + H + ' L0 ' + H + ' Z" fill="rgba(255,107,53,.16)"/><path d="' + line + '" fill="none" stroke="#ff6b35" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>';
  }

  function kpi(v, unit, label, sub) {
    return '<div class="sc-kpi"><div class="sk-val" data-count="' + v + '">0<i>' + unit + '</i></div><div class="sk-label">' + label + '</div>' + (sub ? '<div class="sk-sub">' + sub + '</div>' : '') + '</div>';
  }

  SJ.views = SJ.views || {};
  SJ.views.screen = function () {

    var trend = trend14();

    var audit = SJ.chain.audit(SJ.db);

    var volunteers = volunteerCount();

    var maxTop = tops.length ? tops[0].min : 1;
    var donut = '';

    cats.forEach(function (c, i) {
      var start = acc, end = acc + c.pct;
      donut += CAT_COLORS[i % CAT_COLORS.length] + ' ' + start.toFixed(2) + '% ' + end.toFixed(2) + '%, ';
      acc = end;
    });
    donut = 'conic-gradient(' + donut.replace(/, $/, '') + ')';

    var body = '<div class="screen">' +
      '<header class="sc-head">' +
      '<div class="sc-brand"><span class="sc-logo">' + SJ.logo(38) + '</span><div><b>时迹 · 郑州志愿服务数据</b><span>TIMETRACE · LIVE VOLUNTEER DATA</span></div></div>' +
      '<div class="sc-head-mid"><span class="live-dot"></span>实时同步中<span class="sc-sep"></span>覆盖 <b>' + cities.length + '</b> 个城市<span class="sc-sep"></span><b class="mono">' + orgCount + '</b> 家认证组织</div>' +
      '<div class="sc-clock"><div><b id="sc-time">--:--:--</b><span id="sc-date">----</span></div><i class="sc-exit" data-act="screen.exit">' + SJ.icon('logout', 16) + '</i></div>' +
      '</header>' +

      '<div class="sc-grid">' +
      '<section class="sc-col sc-left">' +
      '<div class="sc-panel"><div class="sc-ph"><h3>服务领域分布</h3><span>按已认证时长</span></div>' +
      '<div class="donut-wrap"><div class="donut" style="background:' + donut + '"><div class="donut-hole"><b>' + recs.length + '</b><span>条认证记录</span></div></div>' +
      '<div class="donut-legend">' + cats.slice(0, 6).map(function (c, i) { return '<div><i style="background:' + CAT_COLORS[i % CAT_COLORS.length] + '"></i><span>' + SJ.esc(c.name) + '</span><b>' + c.pct.toFixed(1) + '%</b></div>'; }).join('') + '</div></div></div>' +

      '<div class="sc-panel grow"><div class="sc-ph"><h3>实时动态</h3><span class="live-mini"><i></i>LIVE</span></div><div class="sc-feed">' +
      evs.map(function (e) {
        return '<div class="feed-row"><span class="fr-dot ' + e.type + '"></span><div><p>' + e.text + '</p><span>' + SJ.fmt.ago(e.at) + (e.meta ? ' · ' + SJ.esc(e.meta) : '') + '</span></div></div>';
      }).join('') + '</div></div>' +
      '</section>' +

      '<section class="sc-col sc-center">' +
      '<div class="sc-hero"><div class="hero-label">累计志愿服务时长</div><div class="hero-num" data-count="' + Math.round(hours) + '">0<i>小时</i></div>' +
      '<div class="sc-kpis">' + kpi(recs.length, '', '认证记录', '累计上链') + kpi(volunteers, '', '注册志愿者', '实名认证') + kpi(chainRate, '%', '存证完整率', '<span class="ok-dot"></span>哈希链校验通过') + '</div>' +
      '<div class="hero-spark">' + sparkline(trend) + '<span>近 14 天认证时长</span></div></div>' +

      '<div class="sc-map-panel"><div class="sc-ph"><h3>郑州 · 服务热力</h3><span>示意分布 · 非地理精确</span></div>' +
      '<div class="heatmap">' + heatDots().map(function (d) {
        return '<div class="heat" style="left:' + d.x + '%;top:' + d.y + '%"><span class="heat-ring" style="--r:' + (d.r * 7) + 'px;--d:' + (d.x % 5) * .4 + 's"></span><span class="heat-core" style="width:' + (d.r + 4) + 'px;height:' + (d.r + 4) + 'px"></span><span class="heat-label">' + d.d + '<b>' + d.n + '</b></span></div>';
      }).join('') +
      '<div class="heat-grid"></div><div class="heat-axis x">金水 · 二七 · 中原 · 管城 · 郑东</div></div></div>' +

      '<div class="sc-chain"><div class="sc-ph"><h3>链上存证</h3><span class="mono">SHA-256 CHAIN · ' + (audit.ok ? 'VERIFIED' : 'ERROR') + '</span></div>' +
      '<div class="chain-blocks">' + recs.slice(-5).reverse().map(function (r) {
        return '<div class="chain-block"><span class="cb-no mono">#' + r.seq + '</span><span class="cb-hash mono">' + SJ.hashShort(r.hash) + '</span><span class="cb-meta">' + SJ.esc(r.userName) + ' · ' + SJ.fmt.hours(r.minutes) + 'h</span></div>';
      }).join('') + '</div></div>' +
      '</section>' +

      '<section class="sc-col sc-right">' +
      '<div class="sc-panel"><div class="sc-ph"><h3>志愿者排行榜</h3><span>本月服务时长</span></div><div class="sc-rank">' +
      tops.map(function (x, i) {
        return '<div class="rank-row"><span class="rk-no ' + (i < 3 ? 'top' : '') + '">' + (i + 1) + '</span>' + SJ.avatar(x.u, 34) + '<div class="rk-main"><div><b>' + SJ.esc(x.u.name) + '</b><span>' + SJ.esc(x.u.school || '') + '</span></div><div class="rk-bar"><i style="width:' + (x.min / maxTop * 100) + '%"></i></div></div><span class="rk-val mono">' + SJ.fmt.hours(x.min) + '<i>h</i></span></div>';
      }).join('') + '</div></div>' +

      '<div class="sc-panel sc-quality"><div class="sc-ph"><h3>存证质量</h3><span>实时校验</span></div>' +
      '<div class="quality"><div class="q-ring" style="background:conic-gradient(#4ecdc4 0 ' + chainRate + '%, rgba(255,255,255,.08) 0)"><div><b>' + chainRate + '</b><span>%</span></div></div>' +
      '<div class="q-list"><div><span>哈希链区块</span><b class="mono">' + (audit.checked || 0) + '</b></div><div><span>链校验</span><b class="ok-text">' + (audit.ok ? '全部通过' : '异常') + '</b></div><div><span>平均审核时长</span><b>' + avgReview.toFixed(1) + ' h</b></div><div><span>驳回率</span><b>' + rejRate.toFixed(1) + '%</b></div></div></div></div>' +

      '<div class="sc-panel grow"><div class="sc-ph"><h3>最新认证</h3><span>证书编号</span></div><div class="sc-certs">' +
      certs.map(function (r) {
        return '<div class="cert-row"><span class="cr-seal">' + SJ.icon('verify', 15) + '</span><div class="cr-main"><b>' + SJ.esc(r.userName) + ' · ' + SJ.esc(r.projectName) + '</b><span class="mono">' + r.certNo + '</span></div><span class="cr-h">+' + SJ.fmt.hours(r.minutes) + 'h</span></div>';
      }).join('') + '</div></div>' +
      '</section></div>' +

      '<footer class="sc-foot"><div class="foot-ticker"><div class="ticker-track">' +
      evs.concat(evs).map(function (e) { return '<span><i>' + SJ.fmt.time(e.at) + '</i>' + e.text + '</span>'; }).join('') +
      '</div></div><div class="foot-right">数据每 5 秒同步 · 演示环境 · 时迹 TimeTrace 2026</div></footer>' +
      '</div>';
    return body;
  };

  SJ.screenMount = function () {
    var timers = SJ._screenTimers = SJ._screenTimers || [];
    timers.forEach(clearInterval); timers.length = 0;
    if (SJ._screenFit) { window.removeEventListener('resize', SJ._screenFit); SJ._screenFit = null; }
    function clock() {
      var d = new Date();
      var t = document.getElementById('sc-time');
      var dt = document.getElementById('sc-date');
      if (t) t.textContent = SJ.fmt.time(d) + ':' + SJ.pad(d.getSeconds());
      if (dt) dt.textContent = SJ.fmt.dateFull(d) + ' · 星期' + SJ.fmt.weekday(d);
    }
    clock();
    timers.push(setInterval(clock, 1000));

    var stage = document.querySelector('.screen');
    function fit() {
      if (!stage) return;
      var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      stage.style.transform = 'scale(' + s + ')';
      stage.style.left = (window.innerWidth - 1920 * s) / 2 + 'px';
      stage.style.top = (window.innerHeight - 1080 * s) / 2 + 'px';
    }
    fit();
    SJ._screenFit = fit;
    window.addEventListener('resize', fit);

    var still = /[?&]still\b/.test(location.search);
    document.querySelectorAll('[data-count]').forEach(function (el) {
      var target = +el.dataset.count;
      var unit = el.querySelector('i') ? el.querySelector('i').outerHTML : '';
      if (still) { el.innerHTML = (target >= 10000 ? target.toLocaleString('en-US') : target) + unit; return; }
      var start = performance.now(), dur = 1400;
      function step(now) {
        var p = Math.min(1, (now - start) / dur);
        var e = 1 - Math.pow(1 - p, 3);
        var v = Math.round(target * e);
        el.innerHTML = (target >= 10000 ? v.toLocaleString('en-US') : v) + unit;
        if (p < 1 && document.body.contains(el)) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  };

  SJ.actions = SJ.actions || {};
  SJ.actions['screen.exit'] = function () { location.hash = '#/'; };
})(window.SJ);

</script>

<script>
/* ==== src/js/views/verify.js ==== */
/* 时迹 TimeTrace · 公开验真页 */
(function (SJ) {
  'use strict';

  function findCert(no) {
    if (!no) return null;
    no = String(no).trim().toUpperCase();
    return SJ.db.records.filter(function (r) { return (r.certNo || '').toUpperCase() === no; })[0] || null;
  }

  function mask(name) {
    if (!name) return '—';
    return name.slice(0, 1) + new Array(Math.max(1, name.length - 1) + 1).join('*');
  }

  function samples() {
    return SJ.db.records.filter(function (r) { return r.certNo && r.status === 'approved'; }).sort(function (a, b) { return new Date(b.verifiedAt) - new Date(a.verifiedAt); }).slice(0, 2).map(function (r) { return r.certNo; });
  }

  SJ.views = SJ.views || {};
  SJ.views.verify = function (no) {
    var rec = findCert(no);
    var ok = rec ? SJ.chain.verify(SJ.db, rec) : false;
    var audit = SJ.chain.audit(SJ.db);
    var head = '<header class="v-head"><a class="brand" href="#/">' + SJ.logo(34) + '<div><b>时迹</b><span>TIMETRACE VERIFY</span></div></a><div class="v-head-r"><a href="#/" class="v-link">返回首页</a><span class="v-badge">' + SJ.icon('shield', 14) + '公开验真</span></div></header>';

    var search = '<form class="v-search" onsubmit="return false"><label>' + SJ.icon('search', 18) + '<input id="v-input" placeholder="输入证书编号，如 SJ-2026-000123" value="' + SJ.esc(no || '') + '" autocomplete="off"></label><button class="btn primary" data-act="verify.go">查 验</button></form>';

        search +

        '<div class="v-note">' + SJ.icon('lock', 14) + '公开页仅展示脱敏信息：姓名保留姓氏，联系方式不公开。</div></div>';

        '<div class="v-summary">' +
        '<div class="v-stamp">' + SJ.icon(ok ? 'check' : 'alert', 30) + '<span>' + (ok ? '验证通过' : '校验异常') + '</span></div>' +
        '<div class="v-summary-main"><div class="v-certno"><span>证书编号</span><b class="mono">' + SJ.esc(rec.certNo) + '</b></div>' +
        '<h2>' + SJ.esc(org.name) + '<br><span>「' + SJ.esc(rec.projectName) + '」志愿服务记录</span></h2></div>' +
        '</div>' +
        '<div class="v-body">' +
        '<div class="v-grid">' +
        '<div><span>志愿者</span><b>' + SJ.esc(mask(user.name)) + '</b></div>' +

        '<div><span>服务时长</span><b class="mono">' + SJ.fmt.hours(rec.minutes) + ' 小时</b></div>' +
        '<div><span>服务地点</span><b>' + SJ.esc(rec.location) + '</b></div>' +
        '<div><span>服务领域</span><b>' + SJ.esc(rec.category) + '</b></div>' +
        '<div><span>见证人</span><b>' + SJ.esc((rec.witness && rec.witness.name) || '组织见证') + '</b></div>' +
        '</div>' +
        '<div class="v-content"><span>服务内容</span><p>' + SJ.esc(rec.content) + '</p></div>' +
        '<div class="v-chain"><div class="vc-head">' + SJ.icon('link', 16) + '<b>哈希链存证</b><span class="vc-state ' + (ok ? 'ok' : 'bad') + '">' + (ok ? '本地重算一致' : '重算不一致') + '</span></div>' +
        '<div class="vc-rows"><div><span>区块高度</span><b class="mono">#' + rec.seq + '</b></div><div><span>记录哈希</span><b class="mono">' + SJ.esc(rec.hash) + '</b></div><div><span>前序哈希</span><b class="mono">' + SJ.esc(rec.prevHash) + '</b></div><div><span>上链时间</span><b>' + SJ.fmt.dateFull(new Date(rec.verifiedAt)) + '</b></div></div>' +
        '<p class="vc-note">验证方式：用证书中的前序哈希与记录字段重新计算 SHA-256，与链上哈希逐位比对。</p></div>' +
        '<div class="v-actions"><a class="btn primary" href="#/cert/' + rec.id + '">' + SJ.icon('award', 16) + '查看完整证书</a><button class="btn ghost" data-act="verify.copy" data-no="' + rec.certNo + '">' + SJ.icon('copy', 16) + '复制验真链接</button></div>' +
        '<div class="v-foot">' + (audit.ok ? '全链校验通过 · ' + audit.checked + ' 个区块连续' : '全链存在断点，请联系签发组织') + ' · 时迹 TimeTrace</div>' +
        '</div></div>';
    } else {
      body = '<div class="v-card v-result fail"><div class="v-stamp">' + SJ.icon('alert', 30) + '<span>未找到证书</span></div><div class="v-certno"><span>查询编号</span><b class="mono">' + SJ.esc(no) + '</b></div>' +
        '<h2>这张证书不在当前账本中</h2><p class="v-lead">请核对编号是否完整。演示版的证书保存在签发设备的浏览器里；换一台设备时，只有内置的演示证书可以被查到。正式版会由组织节点与联盟链共同托管。</p>' +
        search + '<div class="v-try">试试示例：' + samples().map(function (s) { return '<button class="mono" data-act="verify.sample" data-no="' + s + '">' + s + '</button>'; }).join('') + '</div></div>';
    }

    return '<div class="v-page">' + head + '<main class="v-main">' + body + '</main><footer class="v-footer"><span>时迹 TimeTrace · 让每一小时，都有迹可循。</span><span>数据不出浏览器 · 公开信息已脱敏</span></footer></div>';
  };

  SJ.actions = SJ.actions || {};
  SJ.actions['verify.go'] = function () {

  SJ.actions['verify.copy'] = function (el) { SJ.copy(SJ.certUrl(el.dataset.no)); };
})(window.SJ);

</script>

      '<div class="lj-card"><b>02 原型</b><span>一句话记录 → 组织审核 → SHA-256 存证 → 证书 → 编号验真。单文件、无需后端，断网也能演示。</span></div>' +

  };

  /* 交互 */

    if (!t || !out) return;
    var text = t.value.trim();
    if (text.length < 6) { SJ.toast('多写几个字，AI 才猜得出来', 'err'); return; }

      (proj ? '<div class="lpp-proj">' + SJ.icon('link', 13) + '匹配项目：<b>' + SJ.esc(proj.name) + '</b></div>' : '<div class="lpp-proj muted">未匹配到已发布项目，将记为自主服务</div>') +
      '<button class="btn primary block" data-act="lp.use">' + SJ.icon('edit', 15) + '带进记录表单</button></div>';
  };
  SJ.actions['lp.use'] = function () {

    setTimeout(function () { if (SJ.openRecord) SJ.openRecord(''); }, 260);

  SJ.landingMount = function () {
    var still = /[?&]still\b/.test(location.search);
    document.querySelectorAll('.lp-count').forEach(function (el) {
      var target = +el.dataset.n, start = performance.now(), dur = 1100;
      if (still) { el.textContent = target.toLocaleString('en-US'); return; }
      function tick(now) {
        var p = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(target * e).toLocaleString('en-US');
        if (p < 1 && document.body.contains(el)) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
    if (!('IntersectionObserver' in window)) return;
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.12 });
    document.querySelectorAll('.p-card, .flow-step, .tour-card, .sc-card, .road-item, .model-cards > div').forEach(function (el) { el.classList.add('rv'); io.observe(el); });
  };

<script>
/* ==== src/js/boot.js ==== */
/* 时迹 TimeTrace · 启动与路由 */
(function (SJ) {
  'use strict';

  var root = document.getElementById('app');
  var TITLES = {
    landing: '时迹 TimeTrace · 让每一小时，都有迹可循',
    login: '时迹 · 邮箱登录',
    register: '时迹 · 创建账号',
    app: '时迹 · 志愿者端',
    org: '时迹 · 组织审核台',
    screen: '时迹 · 郑州志愿服务数据大屏',
    cert: '时迹 · 志愿服务记录证书',
    verify: '时迹 · 证书验真'
  };

  function parse() {
    var h = location.hash || '';
    if (h && h.indexOf('#/') !== 0) return { anchor: h.slice(1) };
    var raw = h.replace(/^#\/?/, '');
    var parts = raw.split('/').filter(function (x) { return x !== ''; });
    return { view: parts[0] || 'landing', sub: parts[1] || '', param: decodeURIComponent(parts.slice(1).join('/') || '') };
  }

  function html(info) {
    var v = info.view;
    if (v === 'login') return SJ.views.login();
    if (v === 'register') return SJ.views.register();
    if (v === 'app') return SJ.views.app(info.sub || 'home');
    if (v === 'org') return info.sub === 'login' ? SJ.views.orgLogin() : SJ.views.org(info.sub || 'overview');
    if (v === 'screen') return SJ.views.screen();
    if (v === 'cert') return SJ.views.cert(info.param);
    if (v === 'verify') return SJ.views.verify(info.param);
    return SJ.views.landing();
  }

  function render(opts) {
    opts = opts || {};
    var info = parse();
    if (info.anchor && root.innerHTML) return;
    if (info.anchor) info.view = 'landing';
    /* 组织台独立登录 */
    if (info.view === 'org') {
      var orgOK = !!SJ.orgAuth.get();
      if (info.sub === 'login' && orgOK) {
        info.sub = '';
        if (location.hash !== '#/org') location.hash = '#/org';
      } else if (info.sub !== 'login' && !orgOK) {
        info.sub = 'login';
        if (location.hash !== '#/org/login') location.hash = '#/org/login';
      }
    }
    /* 落地页公开；志愿者端必须登录；验真/证书页保持公开 */
    if (info.view === 'app' && !SJ.auth.get()) {
      info.view = 'login'; info.sub = '';
      if (location.hash !== '#/login') location.hash = '#/login';
    }
    var y = window.scrollY;
    root.innerHTML = html(info);
    document.body.dataset.route = info.view;
    document.title = TITLES[info.view] || TITLES.landing;
    if (!opts.keep) window.scrollTo(0, 0); else window.scrollTo(0, y);
    if (info.view === 'landing' && SJ.landingMount) SJ.landingMount();
    if (info.view === 'screen' && SJ.screenMount) SJ.screenMount();
    if (info.view === 'login' && SJ.bindLogin) SJ.bindLogin();
    if (info.view === 'register' && SJ.bindRegister) SJ.bindRegister();
    if (info.view === 'org' && info.sub === 'login' && SJ.bindOrgLogin) SJ.bindOrgLogin();
    if (SJ._onRender) SJ._onRender(info);
    if (info.anchor) {
      var anchorEl = document.getElementById(info.anchor);
      if (anchorEl) setTimeout(function () { anchorEl.scrollIntoView(); }, 0);
    }
  }

  SJ.route = function () { render(); };
  SJ.refresh = function () { render({ keep: true }); };

  function onHash() {
    var h = location.hash;
    if (h && h.indexOf('#/') !== 0) {
      var el = document.getElementById(h.slice(1));
      if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    }
    render();
  }

  /* 跨标签页 / 跨窗口同步 */
  var timer = null;
  SJ.bus.init();
  SJ.bus.on(function (msg) {
    var fresh = SJ.store.load();
    if (fresh && fresh.meta && fresh.records) SJ.db = fresh;
    if (document.body.dataset.route === 'landing') return;
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (document.body.dataset.route === 'screen') { render({ keep: true }); return; }
      render({ keep: true });
    }, 140);
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    var fresh = SJ.store.load();
    if (fresh && fresh.meta) SJ.db = fresh;
    if (document.body.dataset.route !== 'screen') render({ keep: true });
  });

  /* 全局点击委托 */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.dataset.act;
    if (SJ.actions && typeof SJ.actions[act] === 'function') {
      e.preventDefault();
      e.stopPropagation();
      SJ.actions[act](el, e);
    }
  });

  /* 演示导航 */
  SJ.actions = SJ.actions || {};
  SJ.actions['demo.map'] = function () {
    var rows = [
      ['邮箱登录', '演示账号或全新本地账号', '#/login', 'mail'],
      ['志愿者端', '记录、消息、账本、证书、时长银行', '#/app', 'user'],
      ['组织审核台', '审核见证、风控、批量上链', '#/org', 'shield'],

      ['证书验真页', '公开核验，无需登录', '#/verify', 'qr']
    ];
    SJ.modal({
      eyebrow: 'DEMO MAP', title: '演示导航', wide: false,
      body: '<div class="demo-map">' + rows.map(function (r) {
        return '<a class="dm-row" href="' + r[2] + '" data-close><span class="dm-ic">' + SJ.icon(r[3], 18) + '</span><div><b>' + r[0] + '</b><span>' + r[1] + '</span></div>' + SJ.icon('arrowRight', 15) + '</a>';
      }).join('') +
      '<div class="dm-tip">' + SJ.icon('zap', 14) + '演示动线：志愿者提交 → 组织审核上链 → 志愿者收证书 → 扫码验真。多开一个标签页，流程可以实时联动。</div>' +
      '<div class="dm-foot"><button class="btn ghost sm" data-act="demo.reset">' + SJ.icon('refresh', 14) + '重置演示数据</button><span>快捷键 D 打开</span></div></div>'
    });
  };
  SJ.actions['demo.reset'] = function () {
    SJ.confirm('重置演示数据？', '将清空当前浏览器里的记录、照片与兑换，恢复到初始演示状态。', '重置').then(function (ok) { if (ok) SJ.resetDemo(); });
  };

  /* 启动 */
  SJ.initDB();
  /* 演示直达：?demo=1 自动以林知夏身份登录（用于大屏/评审快速进入） */
  if (/[?&]demo=1/.test(location.search) && !SJ.auth.get()) SJ.login(SJ.authDemoEmail, '123456');
  if (/[?&]orgdemo=1/.test(location.search) && !SJ.orgAuth.get()) SJ.orgLogin('zhou@shiji.cn', '123456');
  /* 扫码直达：微信可能丢弃 # 片段，用 query 把证书编号带进来 */
  var qCert = (location.search.match(/[?&]cert=([^&]+)/) || [])[1];
  var qVerify = (location.search.match(/[?&]verify=([^&]+)/) || [])[1];
  if (qCert) location.hash = '#/cert/' + decodeURIComponent(qCert);
  else if (qVerify) location.hash = '#/verify/' + decodeURIComponent(qVerify);
  if (!location.hash) location.hash = '#/';
  render();

  var fab = document.createElement('button');
  fab.className = 'demo-fab';
  fab.setAttribute('data-act', 'demo.map');
  fab.innerHTML = '<span class="df-dot"></span>演示导航';
  document.body.appendChild(fab);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'd' || e.key === 'D') {
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      if (document.body.dataset.route === 'screen' && e.key !== 'd') return;
      e.preventDefault();
      SJ.actions['demo.map']();
    }
  });

  window.addEventListener('hashchange', onHash);
  window.addEventListener('beforeprint', function () { document.body.classList.add('printing'); });
  window.addEventListener('afterprint', function () { document.body.classList.remove('printing'); });
})(window.SJ);

</script>
</body>
</html>
