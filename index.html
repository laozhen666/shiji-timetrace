/* ==== src/styles/main.css ==== */
/* ============================================================
   时迹 TimeTrace · 设计系统
   纸感米白 / 志愿橙 / 墨绿 · 编辑式排版 · 等宽数字
   ============================================================ */

/* ---------- 1. Tokens ---------- */
:root {
  --paper: #f7f3ea;
  --paper-2: #efe8da;
  --paper-3: #e7ddca;
  --card: #fffdf8;
  --ink: #0f3d33;
  --ink-2: #1a4a3f;
  --ink-3: #2d5c50;
  --orange: #ef5a2a;
  --orange-2: #ff7a4d;
  --orange-soft: #fbe3d8;
  --gold: #c2923c;
  --gold-soft: #f3e7ce;
  --muted: #6f7f77;
  --soft: #9aa79f;
  --line: #e3dac8;
  --line-2: #d4c8b1;
  --ok: #1e7a5a;
  --bad: #b4432d;
  --radius: 20px;
  --radius-sm: 14px;
  --shadow: 0 30px 60px -38px rgba(15, 61, 51, .45);
  --shadow-sm: 0 10px 24px -16px rgba(15, 61, 51, .35);
  --font-sans: "PingFang SC", "HarmonyOS Sans SC", "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --font-mono: "SFMono-Regular", "JetBrains Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  --ease: cubic-bezier(.2, .7, .3, 1);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.62;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body.modal-open { overflow: hidden; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
::selection { background: rgba(239, 90, 42, .22); }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tiny { font-size: 12px; color: var(--muted); }
.muted { color: var(--muted); }
.hl { color: var(--orange); }
.ic { display: inline-block; vertical-align: middle; flex: none; }
.eyebrow {
  font-size: 11px; font-weight: 700; letter-spacing: .18em;
  text-transform: uppercase; color: var(--muted);
  display: flex; align-items: center; gap: 8px;
}
.eyebrow.light { color: rgba(247, 243, 234, .62); }
.eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--orange); display: inline-block; }
.link { color: var(--orange); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 2px; }
.link:hover { text-decoration: underline; }

/* ---------- 2. Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 46px; padding: 0 22px; border-radius: 999px;
  border: 1px solid transparent; background: var(--ink); color: var(--paper);
  font-size: 14px; font-weight: 650; letter-spacing: .01em; white-space: nowrap;
  transition: transform .22s var(--ease), box-shadow .22s var(--ease), background .18s, color .18s, border-color .18s;
  text-decoration: none;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.99); }
.btn.primary { background: var(--orange); color: #fff; box-shadow: 0 12px 26px -14px rgba(239, 90, 42, .8); }
.btn.primary:hover { background: #e64f1f; box-shadow: 0 16px 30px -14px rgba(239, 90, 42, .85); }
.btn.dark { background: var(--ink); color: var(--paper); }
.btn.dark:hover { background: var(--ink-2); }
.btn.light { background: var(--paper); color: var(--ink); }
.btn.warm { background: #ffd9c7; color: #63220e; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn.ghost:hover { background: rgba(15, 61, 51, .05); border-color: var(--ink); }
.btn.ghost-light { background: rgba(247, 243, 234, .08); color: var(--paper); border-color: rgba(247, 243, 234, .28); }
.btn.ghost-light:hover { background: rgba(247, 243, 234, .16); }
.btn.outline { background: transparent; color: var(--paper); border-color: rgba(247, 243, 234, .5); }
.btn.outline:hover { background: rgba(247, 243, 234, .12); }
.btn.ok { background: var(--ok); color: #fff; }
.btn.sm { height: 36px; padding: 0 15px; font-size: 12.5px; gap: 5px; }
.btn.lg { height: 54px; padding: 0 28px; font-size: 15px; }
.btn.block { width: 100%; }
.btn.disabled, .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.btn .ic { margin-top: -1px; }
.icon-btn {
  width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center;
  border: 0; background: transparent; border-radius: 50%; color: var(--ink);
  transition: background .18s;
}
.icon-btn:hover { background: rgba(15, 61, 51, .07); }
.icon-btn.line { border: 1px solid var(--line-2); }
.icon-btn.bell { position: relative; }
.icon-btn .dot {
  position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%;
  background: var(--orange); border: 1.5px solid var(--paper);
}
.tiny-btn { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 4px 6px; }
.tiny-btn:hover { color: var(--orange); }

/* ---------- 3. Brand ---------- */
.brand { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); }
.brand .logo-mark { color: var(--ink); }
.brand b { display: block; font-size: 18px; font-weight: 800; letter-spacing: .06em; line-height: 1.2; }
.brand span { display: block; font-size: 9px; font-weight: 600; letter-spacing: .22em; color: var(--muted); }
.brand.sm { gap: 8px; }
.brand.sm b { font-size: 16px; }
.brand.sm .logo-mark { width: 28px; height: 28px; }

/* ---------- 4. Pills / status / covers ---------- */
.pill { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 11.5px; font-weight: 650; background: var(--paper-2); }
.status { display: inline-flex; align-items: center; gap: 3px; height: 21px; padding: 0 7px; border-radius: 6px; font-size: 10.5px; font-weight: 700; white-space: nowrap; }
.status.ok { color: #14624a; background: #dcefe6; }
.status.wait { color: #8a5a12; background: #f8ecd2; }
.status.bad { color: #9c3722; background: #f6ddd5; }
.status.gray { color: var(--muted); background: var(--paper-2); }
.count-chip { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; background: rgba(255, 253, 248, .6); white-space: nowrap; }
.tag-new { font-size: 10px; font-weight: 700; color: var(--orange); background: var(--orange-soft); border-radius: 4px; padding: 2px 6px; }
.risk-chip { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 5px; font-size: 10px; font-weight: 700; }
.risk-chip.low { color: #14624a; background: #dcefe6; }
.risk-chip.mid { color: #8a5a12; background: #f8ecd2; }
.risk-chip.high { color: #9c3722; background: #f6ddd5; }

.cover {
  position: relative; overflow: hidden; height: 108px; flex: none;
  background:
    radial-gradient(120% 120% at 12% 0%, rgba(255, 255, 255, .35), transparent 55%),
    linear-gradient(135deg, color-mix(in srgb, var(--c, #0f3d33) 88%, #fff), color-mix(in srgb, var(--c, #0f3d33) 72%, #000));
  color: #fff; padding: 12px 14px;
}
.cover-lines {
  position: absolute; inset: 0; opacity: .22;
  background-image: repeating-linear-gradient(90deg, rgba(255, 255, 255, .35) 0 1px, transparent 1px 26px);
  mask-image: linear-gradient(120deg, #000, transparent 70%);
}
.cover-cat { position: relative; font-size: 10px; font-weight: 700; letter-spacing: .14em; opacity: .85; }
.cover-word {
  position: absolute; right: 10px; top: -4px; font-size: 52px; font-weight: 800;
  letter-spacing: -.04em; opacity: .16; line-height: 1; white-space: nowrap;
}
.cover-org { position: absolute; left: 14px; bottom: 12px; font-size: 11px; opacity: .85; }
.cover-icon { position: absolute; right: 13px; bottom: 10px; opacity: .9; }
.cover-icon .ic { stroke-width: 1.5; }

/* ---------- 5. Shared sections ---------- */
.section { margin-top: 26px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.section-head h2 { font-size: 17px; font-weight: 750; letter-spacing: -.01em; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; padding: 10px 2px 16px; }
.page-head .eyebrow { margin-bottom: 6px; }
.page-head h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
.page-lead { color: var(--muted); font-size: 13.5px; line-height: 1.7; margin: -2px 2px 16px; }
.app-foot {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 30px 0 14px; color: var(--soft); font-size: 11px;
}
.app-foot .logo-mark { opacity: .55; color: var(--soft); }
.empty { text-align: center; padding: 38px 16px; color: var(--muted); border: 1px dashed var(--line-2); border-radius: 16px; }
.empty .ic { color: var(--soft); margin-bottom: 8px; }
.empty h4 { font-size: 14px; color: var(--ink); margin-bottom: 4px; }
.empty p { font-size: 12px; }

/* ---------- 6. Modal / toast ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 120; display: flex; align-items: center; justify-content: center;
  padding: 24px; background: rgba(9, 30, 25, .48); backdrop-filter: blur(5px);
  opacity: 0; transition: opacity .22s var(--ease);
}
.overlay.in { opacity: 1; }
.modal {
  width: 100%; max-width: 480px; max-height: calc(100vh - 48px);
  background: var(--paper); border-radius: 22px; box-shadow: 0 40px 100px -30px rgba(0, 0, 0, .5);
  display: flex; flex-direction: column; overflow: hidden;
  transform: translateY(14px) scale(.985); transition: transform .26s var(--ease);
}
.overlay.in .modal { transform: none; }
.modal.wide { max-width: 720px; }
.modal.sheet { max-width: 680px; }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 20px 22px 12px; }
.modal-eyebrow { font-size: 10px; font-weight: 700; letter-spacing: .16em; color: var(--orange); margin-bottom: 4px; min-height: 12px; }
.modal-head h3 { font-size: 20px; font-weight: 800; letter-spacing: -.015em; line-height: 1.3; }
.modal-head .icon-btn { margin: -6px -8px 0 0; }
.modal-body { padding: 4px 22px 20px; overflow-y: auto; overscroll-behavior: contain; }
.modal-foot {
  display: flex; align-items: center; justify-content: flex-end; gap: 10px;
  padding: 14px 22px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line);
  background: var(--paper);
}
.modal-foot .foot-note { margin-right: auto; font-size: 11.5px; color: var(--muted); }
.confirm-text { color: var(--muted); font-size: 14px; line-height: 1.7; }
.toast-box { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 8px; background: var(--ink); color: var(--paper);
  padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 550;
  box-shadow: 0 14px 30px -12px rgba(0, 0, 0, .5); opacity: 0; transform: translateY(-8px);
  transition: opacity .24s, transform .24s;
}
.toast.in { opacity: 1; transform: none; }
.toast.ok .ic { color: #7fe0bb; }
.toast.err { background: #7d2a1b; }
.toast.info .ic { color: #ffcf8a; }

/* ---------- 7. Forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 11.5px; font-weight: 650; color: var(--muted); letter-spacing: .02em; }
.field input, .field select, .field textarea, .search-box input {
  width: 100%; border: 1px solid var(--line-2); background: var(--card); border-radius: 11px;
  padding: 11px 12px; font-size: 14px; color: var(--ink); transition: border-color .18s, box-shadow .18s;
  appearance: none;
}
.field textarea { resize: vertical; min-height: 76px; line-height: 1.6; }
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(15, 61, 51, .08);
}
.field-row { display: grid; gap: 10px; margin-bottom: 12px; }
.field-row.two { grid-template-columns: 1fr 1fr; }
.field-row.three { grid-template-columns: 1fr .95fr .95fr; }
.field-row .field { margin: 0; }
.form-note { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--soft); margin-top: 10px; }

/* ---------- 8. Photos ---------- */
.photo-row { display: flex; gap: 8px; flex-wrap: wrap; }
.photo-tile {
  position: relative; width: 76px; height: 76px; margin: 0; border-radius: 10px; overflow: hidden;
  background: var(--paper-2); border: 1px solid var(--line);
}
.photo-tile img { width: 100%; height: 100%; object-fit: cover; }
.photo-tile.tone-a { background: linear-gradient(135deg, #d9e4dc, #a8c0b4); }
.photo-tile.tone-b { background: linear-gradient(135deg, #f5e2d3, #dfb79c); }
.photo-tile.tone-c { background: linear-gradient(135deg, #e7e1ef, #bdb1cd); }
.ph-art {
  position: absolute; inset: 0; opacity: .5;
  background-image: radial-gradient(circle at 30% 35%, rgba(255, 255, 255, .7), transparent 45%),
    repeating-linear-gradient(135deg, transparent 0 8px, rgba(255, 255, 255, .18) 8px 9px);
}
.ph-lock { position: absolute; top: 6px; left: 6px; display: inline-flex; gap: 3px; align-items: center; font-size: 8.5px; color: rgba(15, 61, 51, .7); background: rgba(255, 253, 248, .82); border-radius: 4px; padding: 2px 4px; }
.ph-label { position: absolute; bottom: 5px; left: 6px; font-size: 9px; color: rgba(15, 61, 51, .7); }
.ph-rm { position: absolute; top: 4px; right: 4px; width: 19px; height: 19px; border-radius: 50%; border: 0; background: rgba(15, 61, 51, .72); color: #fff; display: flex; align-items: center; justify-content: center; padding: 0; }
.photo-add {
  width: 76px; height: 76px; border-radius: 10px; border: 1px dashed var(--line-2);
  background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10px;
}
.photo-add:hover { border-color: var(--orange); color: var(--orange); }
.photo-row.static .photo-tile { width: 84px; height: 84px; }

/* ---------- 9. Landing ---------- */
.landing { background: var(--paper); overflow: hidden; }
.lp-nav {
  position: sticky; top: 0; z-index: 60; display: flex; align-items: center; gap: 18px;
  padding: 14px clamp(20px, 5vw, 64px);
  background: rgba(247, 243, 234, .86); backdrop-filter: blur(18px) saturate(1.3);
  border-bottom: 1px solid rgba(15, 61, 51, .09);
}
.lp-links { display: flex; gap: 26px; margin-left: auto; }
.lp-links a { font-size: 13px; color: var(--ink-3); font-weight: 550; position: relative; padding: 4px 0; }
.lp-links a::after { content: ""; position: absolute; left: 0; right: 100%; bottom: 0; height: 1.5px; background: var(--orange); transition: right .25s var(--ease); }
.lp-links a:hover::after { right: 0; }
.lp-nav-r { display: flex; gap: 8px; margin-left: auto; }

.lp-hero {
  position: relative; max-width: 1360px; margin: 0 auto; min-height: calc(100vh - 73px); box-sizing: border-box;
  display: grid; grid-template-columns: 1.02fr .98fr; gap: 28px; align-items: start;
  padding: clamp(48px, 6vw, 84px) clamp(20px, 5vw, 64px) clamp(56px, 7vw, 96px);
}
.hero-grid {
  position: absolute; inset: 0; pointer-events: none; opacity: .55;
  background-image: linear-gradient(rgba(15, 61, 51, .055) 1px, transparent 1px), linear-gradient(90deg, rgba(15, 61, 51, .055) 1px, transparent 1px);
  background-size: 84px 84px;
  mask-image: radial-gradient(80% 70% at 50% 40%, #000 20%, transparent 78%);
}
.hero-left { position: relative; z-index: 2; }
.hero-left h1 {
  font-size: clamp(44px, 5.6vw, 82px); line-height: 1.06; font-weight: 850;
  letter-spacing: -.045em; margin: 18px 0 22px;
}
.hero-left h1 em { font-style: normal; color: var(--orange); position: relative; white-space: nowrap; }
.hero-left h1 em::after {
  content: ""; position: absolute; left: 2%; right: 0; bottom: 6%;
  height: 11px; background: rgba(239, 90, 42, .16); z-index: -1; transform: skewX(-12deg);
}
.hero-lead { font-size: clamp(14.5px, 1.15vw, 16.5px); line-height: 1.85; color: #4b5f57; max-width: 560px; }
.hero-lead b { color: var(--ink); font-weight: 700; box-shadow: inset 0 -8px 0 rgba(239, 90, 42, .14); }
.hero-cta { display: flex; gap: 10px; flex-wrap: wrap; margin: 28px 0 20px; }
.hero-meta { display: flex; gap: 18px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
.hero-meta span { display: inline-flex; align-items: center; gap: 4px; }
.hero-meta .ic { color: var(--ok); }

.hero-right { position: relative; z-index: 2; display: flex; justify-content: center; }
.hero-stage { position: relative; width: min(100%, 460px); padding: 20px 0; }
.hero-stage::before {
  content: ""; position: absolute; inset: 4% -6% 0 6%; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(239, 90, 42, .18), transparent 70%);
  filter: blur(10px); z-index: -1;
}
.hero-cert {
  position: relative; background: #fffdf7; border: 1px solid #e7ddc9; border-radius: 6px;
  padding: 24px 26px 22px; transform: rotate(-3.2deg);
  box-shadow: 0 40px 70px -34px rgba(15, 61, 51, .55), 0 2px 0 #fff inset;
}
.hero-cert::before {
  content: ""; position: absolute; inset: 8px; border: 1px solid rgba(15, 61, 51, .16); pointer-events: none;
}
.hc-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hc-brand { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 750; color: var(--ink); }
.hc-brand .logo-mark { width: 22px; height: 22px; }
.hc-no { font-size: 9.5px; color: var(--muted); }
.hc-title { font-size: 27px; font-weight: 850; letter-spacing: .08em; margin-top: 26px; color: var(--ink); }
.hc-en { font-size: 8.5px; letter-spacing: .26em; color: var(--soft); margin-top: 4px; }
.hc-name { font-size: 42px; font-weight: 800; letter-spacing: .06em; margin: 22px 0 10px; color: var(--ink); }
.hc-text { font-size: 12px; line-height: 1.85; color: #5b6b63; max-width: 320px; }
.hc-text b { color: var(--orange); }
.hc-foot { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 8px 14px; margin-top: 22px; padding-top: 14px; border-top: 1px dashed #d9cfba; }
.hc-seal { display: inline-flex; align-items: center; gap: 5px; color: var(--ok); font-size: 12px; font-weight: 750; border: 1.5px solid var(--ok); border-radius: 50%; width: 68px; height: 68px; flex-direction: column; justify-content: center; transform: rotate(-9deg); opacity: .85; }
.hc-seal span { font-size: 9px; letter-spacing: .1em; }
.hc-qr { margin-left: auto; }
.hc-qr svg { width: 70px; height: 70px; display: block; }
.hc-hash { font-size: 8px; color: var(--soft); flex-basis: 100%; text-align: right; margin-top: -2px; letter-spacing: .02em; }
.hc-stamp {
  position: absolute; right: 24px; top: 92px; width: 64px; height: 64px; border: 2px solid rgba(180, 67, 45, .5);
  border-radius: 50%; color: rgba(180, 67, 45, .62); display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 800; letter-spacing: .12em; transform: rotate(12deg);
}
.float-chip {

}
.hero-grid { position: absolute; inset: 0; opacity: .35; background-image: linear-gradient(rgba(247, 243, 234, .12) 1px, transparent 1px), linear-gradient(90deg, rgba(247, 243, 234, .12) 1px, transparent 1px); background-size: 38px 38px; mask-image: radial-gradient(90% 90% at 70% 0%, #000, transparent 80%); }
.hero-top { position: relative; display: flex; align-items: center; justify-content: space-between; }

.lv-chip { font-size: 9.5px; font-weight: 700; letter-spacing: .08em; color: #ffd0bf; background: rgba(239, 90, 42, .22); border: 1px solid rgba(255, 122, 77, .28); border-radius: 999px; padding: 4px 8px; }
.hero-num { position: relative; font-family: var(--font-mono); font-size: 54px; font-weight: 600; letter-spacing: -.05em; line-height: 1.05; margin-top: 8px; }

.hero-ring-wrap { position: absolute; right: 18px; top: 54px; width: 88px; height: 88px; }

.hero-ring-txt span { font-size: 8px; color: rgba(247, 243, 234, .55); }
.hero-progress { position: relative; margin-top: 20px; }
.hp-row { display: flex; justify-content: space-between; font-size: 9.5px; color: rgba(247, 243, 234, .58); margin-bottom: 5px; }
.hp-bar { height: 5px; border-radius: 5px; background: rgba(247, 243, 234, .14); overflow: hidden; }
.hp-bar i { display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--orange), #ffb08d); }
.hero-actions { position: relative; display: flex; gap: 8px; margin-top: 16px; }
.hero-actions .btn { height: 38px; padding: 0 15px; font-size: 12px; }
.hero-actions .btn.light .ic { color: var(--orange); }

.notice-bar {
  width: 100%; display: flex; align-items: center; gap: 8px; margin-top: 12px;
  background: #fbf0d9; border: 1px solid #efdfb9; border-radius: 12px; padding: 9px 12px;
  font-size: 12px; color: #7a5312; text-align: left;
}

.quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 12px; }
.quick { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; border: 1px solid var(--line); border-radius: 14px; padding: 10px 13px 9px; background: var(--card); text-align: left; position: relative; overflow: hidden; }

.quick span { font-size: 9.5px; color: var(--muted); }

.hscroll { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.hscroll .proj-card { width: 208px; flex: none; scroll-snap-align: start; }

.proj-card {
  display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line);
  border-radius: 16px; overflow: hidden; text-align: left; padding: 0; color: var(--ink);
  transition: transform .25s var(--ease), box-shadow .25s var(--ease);
}

.proj-card .cover { height: 96px; }
.proj-body { padding: 11px 12px 12px; }
.proj-top { display: flex; align-items: center; justify-content: space-between; }
.proj-status { font-size: 9px; font-weight: 700; border-radius: 4px; padding: 2px 6px; }
.proj-status.hot { color: var(--orange); background: var(--orange-soft); }
.proj-status.live { color: var(--ok); background: #dcefe6; }
.proj-hours { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.proj-card h3 { font-size: 14px; font-weight: 750; letter-spacing: -.01em; margin-top: 7px; line-height: 1.35; }
.proj-org, .proj-meta { display: flex; align-items: center; gap: 4px; font-size: 9.5px; color: var(--muted); margin-top: 3px; }
.quota { display: flex; align-items: center; gap: 7px; margin-top: 9px; }
.quota-bar { flex: 1; height: 3px; border-radius: 3px; background: var(--paper-2); overflow: hidden; }
.quota-bar i { display: block; height: 100%; background: var(--orange); border-radius: 3px; }
.quota span { font-size: 8.5px; color: var(--soft); white-space: nowrap; }
.proj-list { display: flex; flex-direction: column; gap: 10px; }
.proj-card.wide { flex-direction: row; align-items: stretch; }
.proj-card.wide .cover { width: 104px; height: auto; min-height: 118px; }
.proj-card.wide .proj-body { flex: 1; min-width: 0; }
.proj-card.wide .cover-word { font-size: 40px; }
.proj-card.wide h3 { margin-top: 5px; }

.rec-list { background: transparent; }
.rec-item {
  width: 100%; display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center;
  border: 0; border-bottom: 1px dashed var(--line); background: transparent; text-align: left;
  padding: 11px 2px; color: var(--ink);
}
.rec-item:last-child { border-bottom: 0; }
.rec-date { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 40px; height: 44px; border-radius: 9px; background: var(--paper-2); }
.rec-date b { font-family: var(--font-mono); font-size: 16px; line-height: 1; font-weight: 600; }
.rec-date span { font-size: 8.5px; color: var(--muted); margin-top: 2px; }
.rec-main { min-width: 0; }
.rec-line { display: flex; align-items: center; gap: 6px; }
.rec-title { font-size: 12.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rec-meta { font-size: 9.5px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rec-text { font-size: 10px; color: var(--soft); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rec-h { font-family: var(--font-mono); font-size: 14px; font-weight: 600; color: var(--ink); }
.rec-h i { font-style: normal; font-size: 9px; color: var(--muted); margin-left: 1px; }

.ledger-sum { display: flex; align-items: stretch; gap: 14px; background: var(--ink); color: var(--paper); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.ls-main { min-width: 108px; border-right: 1px solid rgba(247, 243, 234, .14); padding-right: 14px; }
.ls-main span { display: block; font-size: 9.5px; color: rgba(247, 243, 234, .55); }
.ls-main b { font-family: var(--font-mono); font-size: 30px; font-weight: 600; letter-spacing: -.04em; }
.ls-main i { font-style: normal; font-size: 11px; color: var(--orange-2); margin-left: 2px; }
.ls-side { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); align-items: center; gap: 6px; }
.ls-side b { display: block; font-family: var(--font-mono); font-size: 15px; font-weight: 600; }
.ls-side span { font-size: 8.5px; color: rgba(247, 243, 234, .5); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; background: rgba(15, 61, 51, .06); border-radius: 10px; padding: 3px; margin-bottom: 14px; }
.seg-btn { border: 0; background: transparent; border-radius: 8px; padding: 7px 2px; font-size: 11px; font-weight: 650; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 3px; }
.seg-btn i { font-style: normal; font-family: var(--font-mono); font-size: 9px; opacity: .7; }
.seg-btn.on { background: var(--card); color: var(--ink); box-shadow: 0 2px 6px rgba(15, 61, 51, .08); }
.month-head { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 2px 4px; }
.month-head b { font-size: 11.5px; font-weight: 750; }
.month-head span { font-size: 9px; color: var(--soft); font-family: var(--font-mono); }

.profile { position: relative; margin: -14px -16px 18px; padding: 22px 18px 18px; background: linear-gradient(155deg, #14473c, #0d332b); color: var(--paper); overflow: hidden; }
.profile-bg { position: absolute; inset: 0; opacity: .3; background-image: radial-gradient(circle at 80% 0%, rgba(239, 90, 42, .5), transparent 55%), repeating-linear-gradient(90deg, rgba(247, 243, 234, .1) 0 1px, transparent 1px 34px); }
.profile-main { position: relative; display: flex; align-items: center; gap: 13px; }
.profile-main h1 { font-size: 23px; font-weight: 800; letter-spacing: .02em; }
.profile-main p { font-size: 10.5px; color: rgba(247, 243, 234, .6); margin: 1px 0 5px; }
.id-chip { display: inline-flex; align-items: center; gap: 3px; font-size: 8.5px; color: #ffd0bf; background: rgba(239, 90, 42, .18); border: 1px solid rgba(255, 122, 77, .25); border-radius: 999px; padding: 2px 7px; }
.profile-stats { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(247, 243, 234, .14); }
.profile-stats b { font-family: var(--font-mono); font-size: 20px; font-weight: 600; letter-spacing: -.02em; }

.pl-txt span { display: block; font-size: 8.5px; color: rgba(247, 243, 234, .55); }
.pl-bar { flex: 1; height: 4px; border-radius: 4px; background: rgba(247, 243, 234, .16); overflow: hidden; }
.pl-bar i { display: block; height: 100%; background: var(--orange-2); }
.pl-pct { font-family: var(--font-mono); font-size: 10px; color: #ffd0bf; }

.badge-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.badge { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px 8px; opacity: .48; filter: grayscale(1); }
.badge.got { opacity: 1; filter: none; border-color: #e4d3ae; background: linear-gradient(180deg, #fffdf6, #fbf4e4); }
.badge-ic { width: 32px; height: 32px; border-radius: 50%; background: var(--paper-2); color: var(--ink); display: flex; align-items: center; justify-content: center; }
.badge.got .badge-ic { background: var(--gold-soft); color: var(--gold); }
.badge b { font-size: 9px; letter-spacing: .01em; }
.badge span { font-size: 7.5px; color: var(--soft); line-height: 1.4; }
.menu { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.menu > a, .menu > button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 13px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; color: var(--ink); }
.menu > a:last-child, .menu > button:last-child { border-bottom: 0; }
.menu > a > .ic:first-child, .menu > button > .ic:first-child { color: var(--ink-3); }
.menu > a > div, .menu > button > div { flex: 1; min-width: 0; }
.menu b { display: block; font-size: 12.5px; font-weight: 650; }
.menu span:not(.tag-new) { display: block; font-size: 9.5px; color: var(--soft); }
.menu > a > .ic:last-child, .menu > button > .ic:last-child { color: var(--soft); }

.cert-list { display: flex; flex-direction: column; gap: 9px; }
.cert-row { display: flex; align-items: stretch; gap: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; text-align: left; padding: 0; color: var(--ink); }
.cert-stub { width: 54px; background: var(--ink); color: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 10px 4px; flex: none; }
.cert-stub .logo-mark { color: var(--orange-2); }
.cert-stub span { font-size: 7.5px; text-align: center; line-height: 1.5; color: rgba(247, 243, 234, .7); }
.cert-info { flex: 1; min-width: 0; padding: 11px 12px; }
.cert-info b { display: block; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cert-info span { display: block; font-size: 9px; color: var(--muted); margin-top: 2px; }
.cert-info .mono { font-size: 8.5px; color: var(--soft); letter-spacing: .02em; }
.cert-arrow { display: flex; align-items: center; padding-right: 10px; color: var(--soft); }

.bank-card { display: flex; align-items: center; justify-content: space-between; gap: 14px; background: linear-gradient(145deg, #14473c, #0c2f28); color: var(--paper); border-radius: 18px; padding: 18px; margin-bottom: 14px; }
.bank-l > span { font-size: 10px; color: rgba(247, 243, 234, .55); }
.bank-l b { display: block; font-family: var(--font-mono); font-size: 38px; font-weight: 600; letter-spacing: -.05em; line-height: 1.15; }
.bank-l b i { font-style: normal; font-size: 12px; color: var(--orange-2); }
.bank-l p { font-size: 9px; color: rgba(247, 243, 234, .5); }
.bank-r { text-align: center; color: rgba(255, 208, 190, .9); }
.bank-r span { display: block; font-size: 8.5px; color: rgba(247, 243, 234, .55); margin-top: 3px; }
.reward-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 12px; }
.reward { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; }
.reward-top { display: flex; align-items: center; justify-content: space-between; }
.reward-type { font-size: 8.5px; font-weight: 700; color: var(--rc, var(--orange)); background: color-mix(in srgb, var(--rc, #ef5a2a) 12%, #fff); border-radius: 4px; padding: 2px 6px; }
.reward-stock { font-size: 8px; color: var(--soft); }
.reward-art { height: 46px; display: flex; align-items: center; color: var(--rc, var(--orange)); opacity: .8; }
.reward h3 { font-size: 12px; font-weight: 700; line-height: 1.4; }
.reward p { font-size: 8.5px; color: var(--soft); margin-top: 1px; }
.reward-foot { display: flex; align-items: center; justify-content: space-between; gap: 5px; margin-top: 10px; }
.cost { font-family: var(--font-mono); font-size: 14px; font-weight: 600; }
.cost i { font-style: normal; font-size: 8px; color: var(--muted); }
.reward-foot .btn { height: 28px; padding: 0 9px; font-size: 10px; }
.redeem-list { display: flex; flex-direction: column; gap: 6px; }
.redeem-row { display: flex; align-items: center; gap: 9px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
.rd-ic { width: 30px; height: 30px; border-radius: 8px; background: var(--paper-2); color: var(--ink); display: flex; align-items: center; justify-content: center; }
.redeem-row b { display: block; font-size: 11.5px; }
.redeem-row span { display: block; font-size: 8.5px; color: var(--soft); }
.code-chip { font-family: var(--font-mono); font-size: 9px; background: var(--paper-2); color: var(--ink-3); border-radius: 4px; padding: 3px 6px; margin-left: auto; }
.report-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.report-stats div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px; }
.report-stats b { display: block; font-family: var(--font-mono); font-size: 18px; font-weight: 600; }
.report-stats span { font-size: 8.5px; color: var(--muted); }
.poster-wrap { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--paper-2); box-shadow: var(--shadow); }
.poster-wrap canvas { display: block; width: 100%; height: auto; }
.report-actions { display: flex; gap: 8px; margin-top: 12px; }

.search-box { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 0 6px 0 12px; margin-bottom: 10px; }
.search-box .ic { color: var(--soft); }
.search-box input { border: 0; background: transparent; padding: 11px 0; font-size: 13px; }
.search-box input:focus { outline: none; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 11px; font-size: 11px; color: var(--muted); white-space: nowrap; }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }

.rec-form .ai-panel { background: linear-gradient(160deg, #fff8f0, #fffdf8); border: 1px solid #ecdcc9; border-radius: 14px; padding: 13px; margin-bottom: 14px; }
.ai-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ai-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; color: var(--orange); background: var(--orange-soft); border-radius: 999px; padding: 3px 8px; }
.ai-panel textarea { width: 100%; border: 0; background: transparent; resize: none; padding: 10px 0 4px; font-size: 13px; line-height: 1.7; }
.ai-panel textarea:focus { outline: none; }
.ai-actions { display: flex; align-items: center; gap: 8px; }
.ai-result { margin-top: 10px; }
.ai-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.ai-chip { font-size: 9.5px; border-radius: 4px; padding: 2px 6px; background: #e9f3ee; color: var(--ok); }
.ai-conf { display: flex; align-items: center; gap: 7px; font-size: 9.5px; color: var(--muted); }
.conf-bar { flex: 1; height: 4px; background: var(--paper-2); border-radius: 4px; overflow: hidden; }
.conf-bar i { display: block; height: 100%; background: var(--ok); }
.field-row { margin-bottom: 11px; }
.field-row:last-child { margin-bottom: 0; }
.rec-form .field { margin-bottom: 11px; }
.rec-form .field-row .field { margin-bottom: 0; }
.evidence { margin-top: 12px; }
.evidence-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 11.5px; font-weight: 650; color: var(--muted); margin-bottom: 7px; }
.risk-preview { margin-top: 12px; border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; background: var(--card); }
.risk-line { display: flex; align-items: center; gap: 8px; }
.risk-line b { font-size: 11px; white-space: nowrap; }
.risk-line.low b { color: var(--ok); }
.risk-line.mid b { color: #8a5a12; }
.risk-line.high b { color: var(--bad); }
.risk-bar { flex: 1; height: 4px; background: var(--paper-2); border-radius: 4px; overflow: hidden; }
.risk-bar i { display: block; height: 100%; background: currentColor; }
.risk-line.low .risk-bar i { background: var(--ok); }
.risk-line.mid .risk-bar i { background: var(--gold); }
.risk-line.high .risk-bar i { background: var(--bad); }
.risk-line > span { font-family: var(--font-mono); font-size: 9px; color: var(--muted); }
.risk-flags { margin-top: 7px; display: flex; flex-direction: column; gap: 3px; }
.risk-flags li { display: flex; align-items: center; gap: 4px; font-size: 9.5px; color: var(--muted); }
.risk-flags li.high { color: var(--bad); }
.risk-flags li.mid { color: #8a5a12; }

/* record detail */
.rec-detail .rd-hero { position: relative; background: linear-gradient(150deg, #14473c, #0c2f28); color: var(--paper); border-radius: 14px; padding: 16px; margin-bottom: 14px; overflow: hidden; }
.rd-status { display: inline-flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 700; border-radius: 999px; padding: 3px 8px; background: rgba(247, 243, 234, .12); }
.rd-status.ok { color: #9fe2c4; }
.rd-status.wait { color: #ffd899; }
.rd-status.bad { color: #ffb3a2; }
.rd-status .mono { margin-left: 4px; font-size: 8.5px; color: rgba(247, 243, 234, .5); }
.rd-hero h3 { font-size: 20px; font-weight: 800; margin-top: 10px; letter-spacing: -.01em; }
.rd-hero p { font-size: 10.5px; color: rgba(247, 243, 234, .6); }
.rd-hours { position: absolute; right: 16px; bottom: 14px; text-align: right; }
.rd-hours b { font-family: var(--font-mono); font-size: 34px; font-weight: 600; letter-spacing: -.04em; }
.rd-hours span { font-size: 9px; color: rgba(247, 243, 234, .55); margin-left: 2px; }
.rd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 11px; overflow: hidden; margin-bottom: 14px; }
.rd-grid > div { background: var(--card); padding: 9px 11px; }
.rd-grid span { display: block; font-size: 9px; color: var(--soft); }
.rd-grid b { display: block; font-size: 11.5px; font-weight: 650; margin-top: 2px; }
.rd-block { padding: 11px 0; border-top: 1px dashed var(--line); }
.rd-block:first-of-type { border-top: 0; }
.rd-label { display: block; font-size: 9px; font-weight: 700; letter-spacing: .1em; color: var(--soft); margin-bottom: 6px; text-transform: uppercase; }
.rd-block p { font-size: 12.5px; line-height: 1.8; color: #41554c; }
.witness { display: flex; align-items: center; gap: 9px; }
.w-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--paper-2); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
.witness b { display: block; font-size: 12px; }

.sc-quality { height: 196px; }

/* ---------- 13. Certificate ---------- */
body[data-route="cert"] { background: #e9e1d2; }
.cert-page {
  min-height: 100vh; padding: 24px 16px 60px;

}
.cert-stage { max-width: 820px; margin: 0 auto; }
.cert-tip { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 780px; margin: 0 auto 12px; font-size: 11px; color: var(--muted); }
.cert-actions { display: flex; gap: 7px; }
.cert-sheet {
  position: relative; width: 100%; min-height: 880px; margin: 0 auto; background: #fffdf5;
  border: 1px solid #e0d5bd; box-shadow: 0 40px 80px -40px rgba(15, 61, 51, .5);

}

}
.cs-frame { position: absolute; inset: 16px; border: 1px solid #cbb98e; pointer-events: none; }
.cs-frame::before { content: ""; position: absolute; inset: 5px; border: 1px solid rgba(203, 185, 142, .4); }
.cs-corner { position: absolute; width: 34px; height: 34px; border-color: #b99a5e; border-style: solid; z-index: 2; }
.cs-corner.tl { top: 24px; left: 24px; border-width: 2px 0 0 2px; }
.cs-corner.tr { top: 24px; right: 24px; border-width: 2px 2px 0 0; }

.cs-corner.br { bottom: 24px; right: 24px; border-width: 0 2px 2px 0; }
.cs-watermark { position: absolute; left: 50%; top: 48%; transform: translate(-50%, -50%) rotate(-24deg); font-size: 150px; font-weight: 850; color: rgba(15, 61, 51, .035); letter-spacing: .2em; pointer-events: none; white-space: nowrap; }
.cs-inner { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; }
.cs-head { display: flex; align-items: flex-start; justify-content: space-between; padding-bottom: 20px; border-bottom: 1px solid #d8c9a9; }
.cs-brand { display: flex; align-items: center; gap: 10px; color: var(--ink); }
.cs-brand .logo-mark { color: var(--orange); }
.cs-brand b { display: block; font-size: 17px; letter-spacing: .12em; font-weight: 800; }
.cs-brand span { display: block; font-size: 8px; letter-spacing: .28em; color: #8b8069; }
.cs-no { text-align: right; font-family: var(--font-mono); font-size: 10px; color: #6f6653; letter-spacing: .04em; }
.cs-no span { display: block; font-size: 8px; color: #a29a87; letter-spacing: .1em; }
.cs-title { text-align: center; font-size: 42px; font-weight: 850; letter-spacing: .18em; margin: 40px 0 6px; color: #123c33; }
.cs-en { text-align: center; font-size: 9px; letter-spacing: .4em; color: #a29477; }
.cs-body { padding: 40px 20px 0; }
.cs-lead { font-size: 12px; color: #7b7260; letter-spacing: .06em; }
.cs-name { font-size: 44px; font-weight: 800; letter-spacing: .06em; color: #123c33; border-bottom: 1px solid #cbb98e; padding-bottom: 4px; display: inline-block; min-width: 200px; text-align: center; }
.cs-text { font-size: 14px; line-height: 2.15; color: #4a5a51; margin: 18px 0; max-width: 560px; }
.cs-text b { color: var(--orange); font-weight: 750; }
.cs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #ddd0b5; border: 1px solid #ddd0b5; margin-top: 26px; }
.cs-grid > div { background: #fffdf5; padding: 12px 14px; }
.cs-grid span { display: block; font-size: 8.5px; letter-spacing: .12em; color: #a29477; }
.cs-grid b { display: block; font-size: 12.5px; font-weight: 650; color: #183d33; margin-top: 2px; }
.cs-chain { margin-top: 22px; background: #f5efe2; border: 1px dashed #d3c5a6; padding: 12px 14px; }

.cs-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-top: auto; padding-top: 26px; }

.cs-qr { display: flex; align-items: center; gap: 11px; }
.cs-qr-box { background: #fffdf8; border: 1px solid #d8c7a4; border-radius: 6px; padding: 6px; box-shadow: 0 6px 14px -10px rgba(65, 45, 20, .45); }
.cs-qr-box svg { display: block; width: 96px; height: 96px; }
.cs-qr-txt b { display: block; font-size: 10.5px; letter-spacing: .04em; color: #123c33; }
.cs-qr-txt span { display: block; margin-top: 4px; font-size: 8.5px; line-height: 1.7; color: #8a7a62; }
.cs-qr-offbox { width: 96px; height: 96px; border: 1px dashed #cbb98e; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #b9a88a; background: rgba(255, 253, 248, .6); }
.cs-qr-off .cs-qr-txt b { color: #8a7a62; }
.cs-issue b { display: block; font-size: 12px; color: #183d33; }
.cs-issue span { display: block; font-size: 8.5px; color: #a29477; letter-spacing: .08em; }
.cs-qr { text-align: center; }
.cs-qr svg { width: 86px; height: 86px; }
.cs-qr span { display: block; font-size: 7.5px; color: #a29477; letter-spacing: .1em; }
.seal { position: absolute; right: 44px; bottom: 128px; width: 118px; height: 118px; border: 2.5px solid rgba(180, 50, 38, .62); border-radius: 50%; color: rgba(180, 50, 38, .72); display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-11deg); z-index: 3; }
.seal-in { position: absolute; inset: 6px; border: 1px solid rgba(180, 50, 38, .4); border-radius: 50%; }

.seal-txt { font-size: 8px; letter-spacing: .12em; }
.cert-empty { text-align: center; padding: 80px 20px; }

/* ---------- 14. Verify ---------- */
body[data-route="verify"] { background: var(--paper); }
.v-page { min-height: 100vh; padding: 0 16px 60px; }

.v-main { max-width: 720px; margin: 0 auto; }

.v-stamp span { font-size: 7.5px; letter-spacing: .06em; margin-top: 1px; }
.v-summary h2 { font-size: 19px; line-height: 1.4; font-weight: 800; color: #14624a; margin: 0; }
.v-summary h2 span { font-size: 12.5px; font-weight: 600; color: #3f6f5f; }
.v-body { padding: 18px 22px 20px; }
.v-result p { font-size: 10.5px; color: #527a68; }
.v-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: #e9e1d0; border: 1px solid #e9e1d0; border-radius: 10px; overflow: hidden; }
.v-grid > div { background: var(--card); padding: 11px 13px; min-width: 0; }
.v-grid span { display: block; font-size: 8.5px; letter-spacing: .08em; color: var(--soft); margin-bottom: 3px; }
.v-grid b { display: block; font-size: 12.5px; font-weight: 650; color: var(--ink); overflow-wrap: anywhere; }
.v-content { padding: 0; margin-top: 15px; }
.v-content > span { font-size: 8.5px; letter-spacing: .08em; color: var(--soft); }
.v-content p { font-size: 12.5px; line-height: 1.8; color: #3d5149; margin-top: 4px; }
.v-chain { margin: 15px 0 0; }
.v-actions { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }
.v-foot { margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--line); text-align: center; font-size: 9px; color: var(--soft); }
.v-intro { padding: 34px 30px 28px; }
.v-intro .v-search { margin-top: 20px; text-align: left; }
.v-intro .v-try, .v-intro .v-note { text-align: left; }
.v-intro .v-note { line-height: 1.8; }
.v-intro .v-lead { font-size: 12px; line-height: 1.85; max-width: 520px; margin: 12px auto 0; color: var(--muted); }
.v-badge { margin-left: auto; font-family: var(--font-mono); font-size: 9.5px; background: #dcefe6; color: #14624a; border-radius: 999px; padding: 5px 9px; white-space: nowrap; }
.v-content { padding: 18px 20px; }
.vc-head { display: flex; align-items: center; gap: 7px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.vc-head b { font-size: 15px; margin-right: auto; }
.vc-head span { font-family: var(--font-mono); font-size: 9px; color: var(--muted); white-space: nowrap; }
.vc-rows { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); margin: 14px 0; }
.vc-rows > div { background: var(--card); padding: 9px 11px; min-width: 0; }
.vc-rows span { display: block; font-size: 8.5px; color: var(--soft); }

.vc-note { display: flex; align-items: flex-start; gap: 6px; font-size: 9.5px; color: var(--muted); line-height: 1.7; background: var(--paper); border-radius: 8px; padding: 9px 10px; }
.vc-note .ic { color: var(--ok); margin-top: 1px; }
.v-chain { background: #f2f6f3; border: 1px solid #dfeae4; border-radius: 10px; padding: 11px 12px; margin: 12px 0; }
.v-chain .chain-row { font-size: 9px; }
.v-link { display: flex; gap: 7px; margin-top: 12px; }
.v-actions { display: flex; gap: 7px; justify-content: center; margin-top: 14px; }
.v-try { margin-top: 14px; font-size: 10px; color: var(--soft); text-align: center; }
.v-try button { border: 0; background: none; color: var(--orange); font-size: 10px; text-decoration: underline; }
.v-footer { text-align: center; font-size: 9.5px; color: var(--soft); padding: 24px 0 0; }
.v-note { margin-top: 14px; background: var(--paper-2); border-radius: 12px; padding: 14px 16px; font-size: 11px; color: var(--muted); line-height: 1.8; }

.cert-empty { text-align: center; padding: 70px 20px; }

/* ---------- 15. Demo map / fab ---------- */
.demo-fab {
  position: fixed; z-index: 90; right: 18px; bottom: 20px;

}

.demo-map { display: flex; flex-direction: column; gap: 6px; }

/* ---------- 16. Responsive ---------- */
@media (max-width: 1100px) {

  /* ---------- 风控 ---------- */
  SJ.risk = function (rec, all) {
    var flags = [], score = 0;
    function add(level, text, pts) { flags.push({ level: level, text: text }); score += pts; }
    var minutes = rec.minutes || 0;
    if (minutes > 480) add('high', '单次时长超过 8 小时', 40);
    else if (minutes > 360) add('mid', '单次时长超过 6 小时', 16);
    if (minutes < 30) add('mid', '单次时长不足 30 分钟', 10);
    if (rec.startAt) {
      var st = new Date(rec.startAt), hh = st.getHours();
      if (hh >= 23 || hh < 5) add('mid', '服务时段在深夜（23:00–05:00）', 20);
      if (st.getTime() > Date.now() + 3600e3) add('high', '服务时间晚于当前时间', 30);
      if (st.getTime() < Date.now() - 400 * 864e5) add('mid', '补录时间超过 1 年', 12);
    }
    if (!rec.photos || !rec.photos.length) add('low', '无现场照片', 8);
    else if (rec.photos.length >= 2) score -= 5;
    if (!rec.witness || !rec.witness.name) add('low', '缺少见证人', 10);
    if (rec.witness && rec.witness.phone && !/^1[3-9]\d{9}$/.test(rec.witness.phone)) add('mid', '见证人电话格式异常', 15);

    if (rec.selfReported) add('low', '未关联已发布项目', 6);
    var list = (all || []).filter(function (r) {
      return r.id !== rec.id && r.status !== 'rejected' && r.userId === rec.userId && r.startAt;
    });
    for (var i = 0; i < list.length; i++) {
      var o = list[i];
      var a = new Date(rec.startAt).getTime(), b = a + minutes * 60000;
      var c = new Date(o.startAt).getTime(), d = c + (o.minutes || 0) * 60000;
      if (a < d && c < b) { add('high', '同一时段存在重叠记录', 35); break; }
    }
    score = Math.max(0, Math.min(100, score));
    var level = score >= 45 ? 'high' : score >= 20 ? 'mid' : 'low';
    var riskWord = { high: '高风险', mid: '需复核', low: '低风险' }[level];
    return { score: score, level: level, word: riskWord, flags: flags };

  SJ.store = {

  /* ---------- Toast / Modal / Confirm ---------- */
  SJ.toast = function (msg, type) {

    el.innerHTML = SJ.icon(type === 'err' ? 'alert' : type === 'info' ? 'bell' : 'check', 18) + '<span>' + SJ.esc(msg) + '</span>';
    box.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('in'); });
    setTimeout(function () {
      el.classList.remove('in');
      setTimeout(function () { el.remove(); }, 280);
    }, 2800);
  };

  SJ.modal = function (opts) {
    opts = opts || {};
    var wrap = document.createElement('div');
    wrap.className = 'overlay' + (opts.sheet ? ' is-sheet' : '');
    wrap.innerHTML = '<div class="modal ' + (opts.wide ? 'wide ' : '') + (opts.sheet ? 'sheet ' : '') + (opts.cls || '') + '" role="dialog" aria-modal="true">' +
      '<div class="modal-head"><div><div class="modal-eyebrow">' + (opts.eyebrow || '') + '</div><h3>' + (opts.rawTitle ? opts.title : SJ.esc(opts.title || '')) + '</h3></div>' +
      '<button class="icon-btn" data-close aria-label="关闭">' + SJ.icon('x', 20) + '</button></div>' +
      '<div class="modal-body">' + (opts.body || '') + '</div>' +
      (opts.footer ? '<div class="modal-foot">' + opts.footer + '</div>' : '') + '</div>';
    document.body.appendChild(wrap);
    document.body.classList.add('modal-open');
    requestAnimationFrame(function () { wrap.classList.add('in'); });
    var closed = false;
    function close() {
      if (closed) return; closed = true;
      wrap.classList.remove('in');
      setTimeout(function () {
        wrap.remove();
        if (!document.querySelector('.overlay')) document.body.classList.remove('modal-open');
      }, 220);
    }
    wrap.addEventListener('click', function (e) {
      if (e.target === wrap || e.target.closest('[data-close]')) close();
    });
    function onKey(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); } }
    document.addEventListener('keydown', onKey);
    return { el: wrap, close: close, body: wrap.querySelector('.modal-body') };

  SJ.confirm = function (title, text, okText) {

      var done = false;
      m.el.querySelector('[data-ok]').addEventListener('click', function () { done = true; m.close(); resolve(true); });
      m.el.addEventListener('click', function (e) {

      var svg = q.createSvgTag({ cellSize: 3, margin: 2, scalable: true });

        if (!SJ.db || !SJ.userById(SJ.db.meta.currentUserId)) return null;

          sessionStorage.removeItem(this.SKEY);
        } else {
          sessionStorage.setItem(this.SKEY, JSON.stringify(a));
          localStorage.removeItem(this.KEY);
        }
      } catch (e) {}

    clear: function () {

  };

  /* 初始化 */
  SJ.chain.init();
})(window.SJ);

  SJ.initDB = function () {

      db = SJ.buildSeed();
      SJ.store.save(db);
    }

    var o1 = db.orgs.filter(function (o) { return o.id === 1; })[0];

    db.users.forEach(function (u) {
      if (u.role === 'org' && !u.email && STAFF_EMAILS[u.id]) { u.email = STAFF_EMAILS[u.id]; dirty = true; }
      if (u.email && !u.passHash) { u.passHash = SJ.sha256('123456'); dirty = true; }
    });
    if (dirty) SJ.store.save(db);
    if (!db.notices || db.noticesVersion !== 2) {
      db.notices = makeNotices(db);
      db.noticesVersion = 2;
      SJ.store.save(db);
    }
    if (!db.memberships || db.membershipsVersion !== 1) {
      db.memberships = makeMemberships(db);
      db.membershipsVersion = 1;
      SJ.store.save(db);
    }
    if (!db.enrollments) { db.enrollments = []; SJ.store.save(db); }
    return db;
  };

  SJ.persist = function (silent) {
    var ok = SJ.store.save(SJ.db);
    if (ok) SJ.bus.emit({ type: 'db', at: Date.now() });
    return ok;
  };

  SJ.resetDemo = function () {
    SJ.store.clear();
    SJ.db = SJ.buildSeed();
    SJ.store.save(SJ.db);
    SJ.bus.emit({ type: 'db', at: Date.now() });
    location.hash = '#/';
    location.reload();
  };
})(window.SJ);

<script>
/* ==== src/js/views/app.js ==== */
/* 时迹 TimeTrace · 志愿者端 */
(function (SJ) {

  /* ================= 邮箱登录 ================= */
  function viewLogin() {
    return '<div class="auth-shell">' +
      '<aside class="auth-side">' +
      '<a class="brand" href="#/" style="color:#f7f3ea">' + SJ.logo(38) + '<span><b>时迹</b><i>TIMETRACE</i></span></a>' +
      '<div class="as-body"><p class="eyebrow" style="color:#ffb59c">VOLUNTEER · SIGN IN</p>' +
      '<h1>让每一小时，<br>都有迹可循。</h1>' +
      '<p class="as-lead">登录后，你记录的每一次服务、每一张证书，都会留在这台设备上。不上传，不丢失。</p>' +
      '<ul class="as-list">' +
      '<li>' + SJ.icon('edit', 16) + '<div><b>一句话记录</b><span>AI 自动整理时间、地点、时长</span></div></li>' +
      '<li>' + SJ.icon('shield', 16) + '<div><b>组织见证</b><span>审核通过才计入有效时长</span></div></li>' +
      '<li>' + SJ.icon('qr', 16) + '<div><b>扫码验真</b><span>SHA-256 哈希链，证书可公开查验</span></div></li>' +
      '</ul></div>' +

      '</aside>' +
      '<main class="auth-main"><form class="auth-card" id="login-form" novalidate>' +

      '<label class="auth-field"><span>邮箱</span><div class="af-box">' + SJ.icon('mail', 17) + '<input id="login-email" type="email" autocomplete="username" placeholder="you@example.com"></div></label>' +
      '<label class="auth-field"><span>密码</span><div class="af-box">' + SJ.icon('lock', 17) + '<input id="login-pass" type="password" autocomplete="current-password" placeholder="至少 6 位"><button type="button" class="af-eye" id="login-eye" aria-label="显示密码">' + SJ.icon('eye', 17) + '</button></div></label>' +

  function bindLogin() {
    var form = document.getElementById('login-form');
    if (!form) return;
    var emailEl = document.getElementById('login-email');
    var passEl = document.getElementById('login-pass');
    var errEl = document.getElementById('login-err');
    var eye = document.getElementById('login-eye');
    function fail(msg) { errEl.textContent = msg; errEl.classList.add('on'); }
    function submit() {
      errEl.classList.remove('on');
      var email = (emailEl.value || '').trim().toLowerCase();
      var pass = passEl.value || '';
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('请输入有效的邮箱地址');
      if (pass.length < 6) return fail('密码至少 6 位');
      var remember = !!(document.getElementById('login-remember') || {}).checked;
      var user = SJ.login(email, pass, remember);
      if (!user) return fail('邮箱或密码不正确；没有账号请点下方「创建一个新账号」');
      SJ.toast('欢迎回来，' + user.name);
      location.hash = '#/app/home';
    }
    form.addEventListener('submit', function (e) { e.preventDefault(); submit(); });
    if (eye) eye.addEventListener('click', function () {
      var show = passEl.type === 'password';
      passEl.type = show ? 'text' : 'password';
      eye.innerHTML = SJ.icon(show ? 'eyeOff' : 'eye', 17);
    });
    setTimeout(function () { if (emailEl && !emailEl.value) emailEl.focus(); }, 60);
  }

  function bindRegister() {
    var form = document.getElementById('register-form');
    if (!form) return;
    var errEl = document.getElementById('reg-err');
    function fail(msg) { errEl.textContent = msg; errEl.classList.add('on'); }
    document.querySelectorAll('#reg-gender .af-chip').forEach(function (b) {
      b.addEventListener('click', function () {
        document.querySelectorAll('#reg-gender .af-chip').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
      });
    });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errEl.classList.remove('on');
      var name = (document.getElementById('reg-name').value || '').trim();
      var birth = document.getElementById('reg-birth').value || '';
      var email = (document.getElementById('reg-email').value || '').trim().toLowerCase();
      var pass = document.getElementById('reg-pass').value || '';
      var pass2 = document.getElementById('reg-pass2').value || '';
      var picked = document.querySelector('#reg-gender .af-chip.on');
      var gender = picked ? picked.dataset.value : '';
      if (name.length < 2 || name.length > 12) return fail('姓名请填 2–12 个字，证书上会原样显示');
      if (!birth) return fail('请选择出生日期');
      var bd = new Date(birth + 'T00:00:00');
      if (isNaN(bd.getTime()) || bd > new Date()) return fail('出生日期不正确');
      var age = (Date.now() - bd.getTime()) / 31557600000;
      if (age < 10 || age > 100) return fail('请填写有效的出生日期');
      if (!gender) return fail('请选择性别');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('请输入有效的邮箱地址');
      if (pass.length < 6) return fail('密码至少 6 位');
      if (pass !== pass2) return fail('两次密码不一致');
      var exists = (SJ.db.users || []).filter(function (x) { return (x.email || '').toLowerCase() === email; })[0];
      if (exists) return fail('这个邮箱已经注册过，直接登录即可');
      var u = {
        id: SJ.uid('u'), name: name, role: 'volunteer', orgId: 1, school: '独立志愿者',
        major: '刚刚加入时迹', joined: new Date().toISOString().slice(0, 10), phone: '',
        email: email, passHash: SJ.sha256(pass), birth: birth, gender: gender, sid: '待实名', tone: '#0CA678',
        bio: '从今天开始，记录每一小时。'
      };
      SJ.db.users.push(u);
      SJ.addNotice({
        id: SJ.uid('n'), userId: u.id, type: 'system', orgId: 1, projectId: '',
        title: '欢迎来到时迹，' + name,
        body: '账号已创建。先去「项目」看看附近正在招募的志愿活动，或直接用一句话补录一次服务。',
        at: new Date().toISOString(), read: false, status: 'done'
      });
      SJ.login(email, pass);
      SJ.toast('账号创建成功，欢迎加入时迹');
      location.hash = '#/app/home';
    });
  }

  /* ================= 年度报告 ================= */
  function reportStats() {
    var me = SJ.currentUser();
    var recs = SJ.recsOf(me.id).filter(function (r) { return r.status === 'approved'; });
    var year = new Date().getFullYear();
    recs = recs.filter(function (r) { return r.serviceDate.slice(0, 4) === String(year); });
    var hours = recs.reduce(function (s, r) { return s + r.minutes; }, 0) / 60;
    var cats = {}, months = new Array(12).fill(0), orgs = {};
    recs.forEach(function (r) {
      cats[r.category] = (cats[r.category] || 0) + r.minutes;
      months[new Date(r.serviceDate).getMonth()] += r.minutes;
      orgs[r.orgId] = 1;
    });
    var topCat = Object.keys(cats).sort(function (a, b) { return cats[b] - cats[a]; })[0] || '志愿服务';
    var badges = SJ.badgesFor(recs, SJ.db).filter(function (b) { return b.got; });
    var words = { '助老': '陪伴者', '环保': '护河人', '文化': '讲述者', '支教': '点灯人', '赛会': '护航员', '社区': '邻里', '应急': '守护者', '校园': '同行者', '助残': '星星伙伴' };
    return { me: me, year: year, recs: recs, hours: hours, cats: cats, months: months, orgs: Object.keys(orgs).length, topCat: topCat, word: words[topCat] || '同行者', badges: badges };
  }

  function drawReport(canvas, s) {
    var W = 900, H = 1280, dpr = 2;
    canvas.width = W * dpr; canvas.height = H * dpr;
    var c = canvas.getContext('2d');
    c.scale(dpr, dpr);
    c.fillStyle = '#f7f3ea'; c.fillRect(0, 0, W, H);
    /* 顶部墨绿 */
    c.fillStyle = '#0f3d33'; c.fillRect(0, 0, W, 300);
    c.fillStyle = 'rgba(255,255,255,.06)';
    for (var i = 0; i < 14; i++) { c.fillRect(60 + i * 62, 0, 1, 300); }
    c.fillStyle = '#f7f3ea'; c.font = '600 22px "Microsoft YaHei", sans-serif';
    c.fillText('时迹 TimeTrace', 64, 72);
    c.fillStyle = 'rgba(247,243,234,.6)'; c.font = '400 16px "Microsoft YaHei", sans-serif';
    c.fillText('让每一小时，都有迹可循', 64, 100);
    c.textAlign = 'right'; c.fillStyle = '#ff7a4d'; c.font = '600 18px "Microsoft YaHei", sans-serif';
    c.fillText(s.year + ' 年度志愿报告', W - 64, 72); c.textAlign = 'left';
    c.fillStyle = 'rgba(247,243,234,.55)'; c.font = '400 18px "Microsoft YaHei", sans-serif';
    c.fillText('这一年，你把时间给了谁', 64, 200);
    c.fillStyle = '#f7f3ea'; c.font = '700 64px "Microsoft YaHei", sans-serif';
    c.fillText(s.me.name, 64, 266);
    /* 大数字 */
    c.fillStyle = '#14201c'; c.font = '700 132px "Microsoft YaHei", sans-serif';
    c.fillText(SJ.fmt.hours(s.hours * 60), 64, 460);
    var wnum = c.measureText(SJ.fmt.hours(s.hours * 60)).width;
    c.fillStyle = '#6b7268'; c.font = '500 30px "Microsoft YaHei", sans-serif';
    c.fillText('小时', 64 + wnum + 16, 460);
    c.fillStyle = '#f05a28'; c.font = '600 24px "Microsoft YaHei", sans-serif';
    c.fillText('「' + s.word + '」', 64, 505);
    c.fillStyle = '#3f4a45'; c.font = '400 18px "Microsoft YaHei", sans-serif';
    c.fillText('来自 ' + s.recs.length + ' 次服务 · ' + s.orgs + ' 家组织 · ' + Object.keys(s.cats).length + ' 个领域', 64, 540);
    /* 分隔 */
    c.strokeStyle = '#d8cfbd'; c.lineWidth = 1; c.beginPath(); c.moveTo(64, 585); c.lineTo(W - 64, 585); c.stroke();
    /* 月度柱 */
    c.fillStyle = '#6b7268'; c.font = '500 17px "Microsoft YaHei", sans-serif';
    c.fillText('每月投入', 64, 630);
    var maxM = Math.max.apply(null, s.months.concat([1]));
    var bw = 46, gap = 22, base = 790;
    s.months.forEach(function (m, idx) {
      var h = Math.max(3, m / maxM * 120);
      c.fillStyle = m ? (idx === s.months.indexOf(maxM) ? '#f05a28' : '#0f3d33') : '#e3dccd';
      c.fillRect(64 + idx * (bw + gap), base - h, bw, h);
      c.fillStyle = '#9a9f96'; c.font = '400 13px "Microsoft YaHei", sans-serif'; c.textAlign = 'center';
      c.fillText((idx + 1) + '月', 64 + idx * (bw + gap) + bw / 2, base + 24);
    });
    c.textAlign = 'left';
    /* 领域 */
    var cx = 64, cy = 880;
    c.fillStyle = '#6b7268'; c.font = '500 17px "Microsoft YaHei", sans-serif';
    c.fillText('时间去向', cx, cy);
    var keys = Object.keys(s.cats).sort(function (a, b) { return s.cats[b] - s.cats[a]; }).slice(0, 4);
    keys.forEach(function (k, i) {
      var y = cy + 44 + i * 40;
      c.fillStyle = SJ.catMeta(k).color; c.fillRect(cx, y - 12, 8, 8);
      c.fillStyle = '#14201c'; c.font = '500 18px "Microsoft YaHei", sans-serif'; c.fillText(k, cx + 22, y);
      c.fillStyle = '#6b7268'; c.font = '400 16px "Microsoft YaHei", sans-serif'; c.textAlign = 'right';
      c.fillText(SJ.fmt.hours(s.cats[k]) + ' h', W - 64, y); c.textAlign = 'left';
    });
    /* 引用 */
    c.fillStyle = '#0f3d33'; c.fillRect(64, 1078, W - 128, 92);
    c.fillStyle = '#f7f3ea'; c.font = '400 18px "Microsoft YaHei", sans-serif';
    c.fillText('「志愿不是一段被记录的时长，', 88, 1118);
    c.fillText('  而是一段被记住的时间。」', 88, 1148);
    /* 底部 */
    c.fillStyle = '#9a9f96'; c.font = '400 14px "Microsoft YaHei", sans-serif';
    c.fillText('时迹 TimeTrace · 中原黑客松 2026 · ' + s.year + ' 年度报告', 64, 1222);
    c.textAlign = 'right'; c.fillStyle = '#0f3d33'; c.font = '600 16px "Microsoft YaHei", sans-serif';
    c.fillText(s.me.name + ' · ' + s.word, W - 64, 1222);
  }

  };

  /* ================= 记录服务 ================= */
  function compressImage(file) {
    return new Promise(function (resolve) {
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var max = 760, w = img.width, h = img.height;
          if (Math.max(w, h) > max) { var k = max / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
          var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(cv.toDataURL('image/jpeg', 0.72));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  SJ.openRecord = function (prefillProject) {
    var me = SJ.currentUser();
    var draft = { photos: [], projectId: prefillProject || '' };
    var now = new Date();
    var body = '<div class="rec-form">' +
      '<div class="ai-panel"><div class="ai-head"><span class="ai-badge">' + SJ.icon('sparkles', 13) + 'AI 语义补录</span><span class="tiny">本地解析 · 数据不上传</span></div>' +
      '<textarea id="ai-input" rows="3" placeholder="例：今天下午 2 点到 5 点，在经三路社区陪李奶奶聊天、量血压，3 小时"></textarea>' +
      '<div class="ai-actions"><button type="button" class="btn dark sm" id="ai-parse">' + SJ.icon('sparkles', 14) + '帮我整理</button><span class="tiny" id="ai-hint">支持「昨天 / 下午三点 / 两小时 / 地点」</span></div>' +
      '<div id="ai-result"></div></div>' +
      '<div class="field-row"><label class="field"><span>关联项目</span><select id="f-project"><option value="">不关联项目 · 自主记录</option>' +
      SJ.db.projects.map(function (p) { return '<option value="' + p.id + '" ' + (p.id === draft.projectId ? 'selected' : '') + '>' + SJ.esc(p.name) + ' · ' + SJ.esc(p.orgShort) + '</option>'; }).join('') + '</select></label></div>' +
      '<div class="field-row three">' +
      '<label class="field"><span>服务日期</span><input type="date" id="f-date" value="' + SJ.fmt.ymd(now) + '" max="' + SJ.fmt.ymd(now) + '"></label>' +
      '<label class="field"><span>开始时间</span><input type="time" id="f-start" value="14:00"></label>' +
      '<label class="field"><span>时长（小时）</span><input type="number" id="f-hours" step="0.5" min="0.5" max="12" value="2"></label>' +
      '</div>' +
      '<label class="field"><span>服务地点</span><input id="f-location" placeholder="如：经三路社区养老服务站"></label>' +
      '<label class="field"><span>做了什么</span><textarea id="f-content" rows="3" placeholder="具体描述服务内容，至少 12 个字"></textarea></label>' +
      '<div class="field-row two"><label class="field"><span>见证人</span><input id="f-witness" placeholder="组织联系人姓名"></label><label class="field"><span>联系电话</span><input id="f-phone" inputmode="tel" placeholder="13800000000"></label></div>' +
      '<div class="evidence"><div class="evidence-head"><span>现场材料</span><span class="tiny">最多 3 张 · 自动压缩</span></div><div class="photo-row" id="photo-row"></div><input type="file" id="photo-input" accept="image/*" hidden></div>' +
      '<div id="risk-box"></div>' +
      '<p class="form-note">' + SJ.icon('lock', 12) + '提交后由项目所属组织见证；通过后写入哈希链并生成证书。</p>' +
      '</div>';

    var m = SJ.modal({
      title: '记录这次服务', eyebrow: 'NEW RECORD', body: body, wide: true, sheet: true,
      footer: '<button class="btn ghost" data-close>先不记</button><button class="btn primary" id="rec-submit">' + SJ.icon('shield', 16) + '提交认证</button>'
    });

    var $ = function (s) { return m.el.querySelector(s); };
    var projectSel = $('#f-project'), dateEl = $('#f-date'), startEl = $('#f-start'), hoursEl = $('#f-hours');
    var locEl = $('#f-location'), contentEl = $('#f-content'), witEl = $('#f-witness'), phoneEl = $('#f-phone');

    function selectedProject() { return projectSel.value ? SJ.projectById(projectSel.value) : null; }

    function fillWitness() {
      var p = selectedProject();
      if (!p || witEl.value) return;
      var org = SJ.orgById(p.orgId);
      if (org) { witEl.value = org.contact; phoneEl.value = org.phone; }
    }
    projectSel.addEventListener('change', function () {
      var p = selectedProject();
      if (p) {
        if (!locEl.value) locEl.value = p.location;
        if (!hoursEl.value || hoursEl.value === '2') hoursEl.value = p.hours;
        fillWitness();
        updateRisk();
      }
    });

    function renderPhotos() {
      var row = $('#photo-row');
      row.innerHTML = draft.photos.map(function (ph, i) { return UI.photoTile(ph, i, true); }).join('') +
        (draft.photos.length < 3 ? '<button type="button" class="photo-add" id="photo-add">' + SJ.icon('camera', 22) + '<span>拍照 / 相册</span></button>' : '');
      var add = $('#photo-add');
      if (add) add.onclick = function () { $('#photo-input').click(); };
    }
    renderPhotos();

    $('#photo-input').addEventListener('change', function (e) {
      var files = Array.prototype.slice.call(e.target.files || []).slice(0, 3 - draft.photos.length);
      Promise.all(files.map(compressImage)).then(function (urls) {
        urls.forEach(function (u) { draft.photos.push({ src: u }); });
        renderPhotos(); updateRisk();
      });
      e.target.value = '';
    });

    m.el.addEventListener('click', function (e) {
      var rm = e.target.closest('[data-act="record.rmphoto"]');
      if (rm) { draft.photos.splice(+rm.dataset.i, 1); renderPhotos(); updateRisk(); }
    });

    function readForm() {
      var p = selectedProject();
      var date = dateEl.value || SJ.fmt.ymd(new Date());
      var start = startEl.value || '14:00';
      var hours = parseFloat(hoursEl.value) || 0;
      var org = p ? SJ.orgById(p.orgId) : null;
      return {
        id: '__draft__', userId: me.id, userName: me.name, userTone: me.tone,
        projectId: p ? p.id : null, projectName: p ? p.name : '自主服务',
        orgId: p ? p.orgId : null, orgShort: p ? p.orgShort : (witEl.value ? '个人记录' : '未关联组织'),
        category: p ? p.category : '社区',
        location: locEl.value || (p ? p.location : ''),
        content: contentEl.value.trim(),
        minutes: Math.round(hours * 60),
        serviceDate: date, startAt: date + 'T' + start,
        witness: witEl.value ? { name: witEl.value.trim(), phone: phoneEl.value.trim(), role: org ? org.type : '见证人' } : null,
        photos: draft.photos.slice(), status: 'pending', selfReported: !p,
        createdAt: new Date().toISOString()
      };
    }

    function updateRisk() {
      var rec = readForm();
      var risk = SJ.risk(rec, SJ.db.records);
      var box = $('#risk-box');
      if (!box) return;
      box.innerHTML = '<div class="risk-preview ' + risk.level + '"><div class="rp-head"><span>' + SJ.icon('shield', 14) + '提交前自检</span><b>' + risk.word + ' · ' + risk.score + '</b></div>' +
        (risk.flags.length ? '<div class="rp-flags">' + risk.flags.map(function (f) { return '<span class="' + f.level + '">' + SJ.esc(f.text) + '</span>'; }).join('') + '</div>' : '<div class="rp-ok">' + SJ.icon('check', 13) + '材料齐全，通过率很高</div>') + '</div>';
      return risk;
    }

    ['input', 'change'].forEach(function (ev) {
      m.el.addEventListener(ev, function (e) {
        if (e.target.closest('.rec-form')) updateRisk();
      });
    });
    updateRisk();

    if (SJ._pendingAI) {
      $('#ai-input').value = SJ._pendingAI;
      SJ._pendingAI = '';
      setTimeout(function () { var b = $('#ai-parse'); if (b) b.click(); }, 80);
    }

    $('#ai-parse').addEventListener('click', function () {
      var text = $('#ai-input').value.trim();
      if (!text) { SJ.toast('先写一句话，再让 AI 整理', 'err'); return; }
      var p = SJ.parseRecord(text);
      if (p.projectId) projectSel.value = p.projectId;
      dateEl.value = p.date;
      startEl.value = p.startAt.slice(11, 16);
      hoursEl.value = (Math.round(p.minutes / 30) / 2).toFixed(1).replace(/\.0$/, '');
      if (p.location) locEl.value = p.location;
      if (!contentEl.value.trim()) contentEl.value = text;
      if (p.people) contentEl.value = text;
      fillWitness();
      var proj = p.projectId ? SJ.projectById(p.projectId) : null;
      $('#ai-result').innerHTML = '<div class="ai-result"><div class="ai-chips">' +
        '<span>' + SJ.icon('calendar', 12) + p.date + '</span>' +
        '<span>' + SJ.icon('clock', 12) + startEl.value + ' · ' + SJ.fmt.dur(p.minutes) + '</span>' +
        (p.location ? '<span>' + SJ.icon('pin', 12) + SJ.esc(p.location) + '</span>' : '') +
        '<span>' + SJ.icon('compass', 12) + SJ.esc(p.category || '未识别领域') + '</span>' +
        (proj ? '<span class="hl">' + SJ.icon('link', 12) + SJ.esc(proj.name) + '</span>' : '') +
        '</div><div class="ai-conf"><span>解析置信度</span><div class="conf-bar"><i style="width:' + Math.round(p.confidence * 100) + '%"></i></div><b>' + Math.round(p.confidence * 100) + '%</b></div><p class="tiny">已自动填入，请核对后提交。地点与见证人可手动修改。</p></div>';
      updateRisk();
      SJ.toast('已整理，请核对');
    });

    $('#rec-submit').addEventListener('click', function () {
      var rec = readForm();
      if (rec.content.length < 6) { SJ.toast('再写具体一点：做了什么？', 'err'); contentEl.focus(); return; }
      if (!rec.minutes || rec.minutes < 30) { SJ.toast('时长至少 30 分钟', 'err'); hoursEl.focus(); return; }
      if (rec.minutes > 720) { SJ.toast('单次时长不能超过 12 小时', 'err'); return; }
      var risk = updateRisk();
      function go() {
        rec.id = SJ.uid('r');
        rec.risk = risk;
        rec.status = 'pending';
        rec.createdAt = new Date().toISOString();
        SJ.db.records.unshift(rec);
        SJ.pushEvent('new', '<b>' + SJ.esc(me.name) + '</b> 提交了「' + SJ.esc(rec.projectName) + '」的服务记录', SJ.fmt.hours(rec.minutes) + 'h · 待见证');
        SJ.persist();
        SJ.bus.emit({ type: 'new-record', rec: rec });
        m.close();
        SJ.refresh();
        SJ.toast('已提交，等待「' + rec.orgShort + '」见证');
      }
      if (risk.level === 'high') {
        SJ.confirm('这条记录可能需要补充材料', '系统检测到 ' + risk.flags.filter(function (f) { return f.level === 'high'; }).map(function (f) { return f.text; }).join('、') + '。仍要提交吗？', '仍要提交').then(function (ok) { if (ok) go(); });
      } else go();
    });
  };
